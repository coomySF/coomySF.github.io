<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>秘密基地回信</title>
<style>
  :root {
    --bg: #fbf4ea;
    --card: #ffffff;
    --ink: #3b2a22;
    --muted: #8a776b;
    --line: rgba(59, 42, 34, 0.12);
    --kid: #fff1dc;
    --me: #f07a5f;
    --me-ink: #ffffff;
    --accent: #f07a5f;
    --danger: #d64545;
    --ease-smooth-out: cubic-bezier(0.22, 1, 0.36, 1);
    --duration-quick: 150ms;
    --duration-fast: 250ms;
    --duration-slow: 400ms;
    --toast-open: 350ms;
    --toast-close: 250ms;
    --toast-distance: 16px;
    --toast-blur: 2px;
    --toast-scale: 0.97;
    --toast-ease: cubic-bezier(0.22, 1, 0.36, 1);
    --shimmer-dur: 2000ms;
    --shimmer-base: #a8968a;
    --shimmer-highlight: #3b2a22;
    --shimmer-band: 400%;
    --shimmer-ease: linear;
    --shake-distance: 6px;
    --shake-overshoot: 4px;
    --shake-dur-a: 80ms;
    --shake-dur-b: 60ms;
    --shake-ease: cubic-bezier(0.22, 1, 0.36, 1);
    --revert-hold: 3000ms;
    --revert-dur: 280ms;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1f1915; --card: #2b231e; --ink: #f6ebe0; --muted: #b3a196; --line: rgba(246, 235, 224, 0.12);
      --kid: #3a2e25; --shimmer-base: #8a776b; --shimmer-highlight: #f6ebe0;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
    font-family: "PingFang TC", "Noto Sans TC", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button, textarea, input { font: inherit; color: inherit; }
  .shell { max-width: 640px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }
  header { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 10px;
    padding: max(14px, env(safe-area-inset-top)) 16px 12px; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  header .bear { font-size: 26px; }
  header h1 { margin: 0; font-size: 18px; font-weight: 800; }
  header p { margin: 0; font-size: 12px; color: var(--muted); }
  header > div { flex: 1; min-width: 0; }
  /* 我在／我忙：我在 → 娃娃只處理緊急，等你親口回；我忙 → 娃娃先接住孩子 */
  .presence { flex: none; border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 800;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background-color var(--duration-fast) var(--ease-smooth-out), color var(--duration-fast) var(--ease-smooth-out); }
  .presence::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #c9c3bb; }
  .presence[data-presence="here"] { background: #e6f6ee; border-color: #3f9a74; color: #2b6e51; }
  .presence[data-presence="here"]::before { background: #3f9a74; }
  .presence[data-presence="away"] { background: #fff1d6; border-color: #e0a84a; color: #8a5a12; }
  .presence[data-presence="away"]::before { background: #e0a84a; }
  .presence[hidden] { display: none; }
  .presence[disabled] { opacity: 0.6; pointer-events: none; }

  /* 孩子分頁：虎妞／屁孩，各自一條對話線；有新的悄悄話會亮小紅點 */
  .kid-tabs { display: flex; gap: 8px; padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .kid-tab { position: relative; flex: 1; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 9px 12px;
    font-weight: 800; font-size: 15px; cursor: pointer; transition: background-color var(--duration-fast) var(--ease-smooth-out), color var(--duration-fast) var(--ease-smooth-out); }
  .kid-tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .kid-tab .dot { position: absolute; top: 6px; right: 12px; width: 9px; height: 9px; border-radius: 50%; background: var(--danger);
    transform: scale(0); transition: transform var(--duration-slow) cubic-bezier(0.34, 1.36, 0.64, 1); }
  .kid-tab.has-new .dot { transform: scale(1); }
  .both { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
  .both input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
  .both:has(input:checked) { color: var(--ink); font-weight: 700; }
  .to-line { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--muted); }

  .thread { flex: 1; padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 14px; }
  .empty { margin: 40px auto; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.7; }
  .msg { max-width: 86%; display: flex; flex-direction: column; gap: 6px; animation: msg-in var(--duration-slow) var(--ease-smooth-out) both; }
  .msg.kid { align-self: flex-start; }
  .msg.parent { align-self: flex-end; align-items: flex-end; }
  .bubble { padding: 12px 14px; border-radius: 18px; line-height: 1.6; font-size: 16px; word-break: break-word; }
  .kid .bubble { background: var(--kid); border-bottom-left-radius: 6px; }
  .parent .bubble { background: var(--me); color: var(--me-ink); border-bottom-right-radius: 6px; }
  /* 娃娃先回的信：靠左、奶油色，和孩子的話區分 */
  .msg.doll { align-self: flex-start; }
  .doll .bubble { background: #fff1d6; border-bottom-left-radius: 6px; }
  .doll .bubble .who { display: block; font-size: 12px; font-weight: 800; color: #8a5a12; margin-bottom: 2px; }
  /* 小抄：掛在孩子那句話底下 */
  .note { max-width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 8px 12px; font-size: 13px; line-height: 1.6; }
  .note summary { cursor: pointer; font-weight: 800; list-style: none; display: flex; gap: 6px; align-items: center; }
  .note summary::-webkit-details-marker { display: none; }
  .note summary .tag { font-weight: 700; font-size: 11px; padding: 1px 8px; border-radius: 999px; background: #efe9ff; color: #5b43b3; }
  .note summary .tag.urgent { background: #ffe1e1; color: #b32626; }
  .note summary .tag.pass { background: #fff1d6; color: #8a5a12; }
  .note dl { margin: 8px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; }
  .note dt { color: var(--muted); font-weight: 700; white-space: nowrap; }
  .note dd { margin: 0; }
  .bubble audio { display: block; width: 240px; max-width: 100%; height: 36px; margin-top: 6px; }
  .bubble .said { font-weight: 700; }
  .bubble .unclear { color: var(--muted); font-size: 14px; }
  .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .heard { color: #3f9a74; font-weight: 700; }
  .msg.is-focus .bubble { box-shadow: 0 0 0 3px var(--accent); }
  @keyframes msg-in { from { opacity: 0; transform: translateY(8px); filter: blur(2px); } to { opacity: 1; transform: none; filter: blur(0); } }

  .composer { position: sticky; bottom: 0; padding: 10px 16px max(14px, env(safe-area-inset-bottom));
    background: var(--bg); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
  .chip { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 12px;
    font-size: 13px; cursor: pointer; transition: transform var(--duration-quick) var(--ease-smooth-out); }
  .chip:active { transform: scale(0.96); }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; resize: none; min-height: 48px; max-height: 160px; padding: 12px 14px; border-radius: 16px;
    border: 1.5px solid var(--line); background: var(--card); line-height: 1.5; outline: none; }
  textarea:focus { border-color: var(--accent); }
  .icon-btn { flex: none; width: 48px; height: 48px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer;
    background: var(--card); box-shadow: inset 0 0 0 1.5px var(--line);
    transition: transform var(--duration-quick) var(--ease-smooth-out), background-color var(--duration-fast) var(--ease-smooth-out); }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn.primary { background: var(--accent); box-shadow: none; color: #fff; }
  .icon-btn[disabled] { opacity: 0.4; pointer-events: none; }
  .icon-btn.is-recording { background: var(--danger); color: #fff; box-shadow: none; animation: rec 1.2s ease-in-out infinite; }
  @keyframes rec { 50% { box-shadow: 0 0 0 8px rgba(214, 69, 69, 0.18); } }
  .rec-preview { display: none; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 16px; background: var(--card); box-shadow: inset 0 0 0 1.5px var(--line); }
  .rec-preview.is-shown { display: flex; }
  .rec-preview audio { flex: 1; height: 36px; min-width: 0; }
  .rec-timer { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--danger); font-weight: 700; display: none; }
  .rec-timer.is-shown { display: inline; }
  .hint-line { font-size: 12px; color: var(--muted); min-height: 18px; }

  /* 附件：一封信只能帶一張照片或一張貼紙；選了就在這裡預覽，叉掉就拿掉 */
  .attach-row { display: flex; gap: 8px; align-items: center; }
  .attach-btn { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 700;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: transform var(--duration-quick) var(--ease-smooth-out); }
  .attach-btn:active { transform: scale(0.96); }
  .attach-btn[aria-expanded="true"] { background: #fff1d6; border-color: #e0a84a; }
  .attach-preview { display: none; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 16px; background: var(--card); box-shadow: inset 0 0 0 1.5px var(--line); }
  .attach-preview.is-shown { display: flex; }
  .attach-preview img { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; background: var(--kid); }
  .attach-preview .big { font-size: 40px; line-height: 1; width: 56px; text-align: center; }
  .attach-preview .what { flex: 1; font-size: 13px; line-height: 1.5; }
  .attach-preview .what b { display: block; font-size: 14px; }
  .attach-preview .what span { color: var(--muted); }
  .sticker-tray { display: none; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 10px; border-radius: 16px; background: var(--card); box-shadow: inset 0 0 0 1.5px var(--line); }
  .sticker-tray.is-shown { display: grid; }
  .sticker-tray button { border: 0; background: var(--kid); border-radius: 14px; padding: 8px 0 6px; font-size: 30px; line-height: 1; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px; transition: transform var(--duration-quick) var(--ease-smooth-out); }
  .sticker-tray button:active { transform: scale(0.92); }
  .sticker-tray button small { font-size: 11px; font-weight: 700; color: var(--muted); }
  .bubble img.photo { display: block; width: 220px; max-width: 100%; border-radius: 12px; margin-top: 6px; background: rgba(255,255,255,0.3); }
  .bubble .sticker { display: flex; align-items: center; gap: 10px; margin-top: 4px; font-size: 15px; }
  .bubble .sticker b { font-size: 44px; line-height: 1; }

  /* Shimmer：ElevenLabs 生成中 */
  .t-shimmer {
    position: relative;
    display: inline-block;
    color: var(--shimmer-base);
  }
  .t-shimmer::before {
    content: attr(data-text);
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image: linear-gradient(
      90deg,
      transparent          0%,
      transparent         40%,
      var(--shimmer-highlight) 50%,
      transparent         60%,
      transparent        100%
    );
    background-size: var(--shimmer-band) 100%;
    background-repeat: no-repeat;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    animation: t-shimmer var(--shimmer-dur) var(--shimmer-ease) infinite;
  }
  @keyframes t-shimmer {
    0%   { background-position: 100% 0; }
    100% { background-position: 0% 0; }
  }

  /* Toast：送出成功 */
  .toast-dock { position: fixed; left: 0; right: 0; bottom: 150px; display: grid; place-items: center; pointer-events: none; z-index: 5; }
  .t-toast {
    opacity: 0;
    transform: translateY(var(--toast-distance)) scale(var(--toast-scale));
    filter: blur(var(--toast-blur));
    will-change: transform, opacity, filter;
    transition:
      opacity var(--toast-close) var(--toast-ease),
      transform var(--toast-close) var(--toast-ease),
      filter var(--toast-close) var(--toast-ease);
  }
  .t-toast.is-open {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0);
    transition:
      opacity var(--toast-open) var(--toast-ease),
      transform var(--toast-open) var(--toast-ease),
      filter var(--toast-open) var(--toast-ease);
  }
  .t-toast { background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 700; }

  /* 登入 */
  .gate { flex: 1; display: grid; place-items: center; padding: 24px 16px; }
  .gate form { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; text-align: center; }
  .gate h2 { margin: 0; font-size: 22px; }
  .gate p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
  .gate input { padding: 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); outline: none; text-align: center; }
  .gate input.is-error { border-color: var(--danger); }
  .gate button { padding: 14px; border-radius: 14px; border: 0; background: var(--accent); color: #fff; font-weight: 800; cursor: pointer; }
  .t-input {
    transition: border-color 150ms ease-out;
    will-change: transform;
  }
  .t-input.is-error {
    transition: border-color var(--revert-dur, 280ms) ease-out;
  }
  .t-error-msg {
    opacity: 0;
    visibility: hidden;
    transition:
      opacity    var(--revert-dur, 280ms) ease-out,
      visibility 0s linear var(--revert-dur, 280ms);
  }
  .t-input-wrap.is-error .t-error-msg {
    opacity: 1;
    visibility: visible;
    transition:
      opacity    var(--revert-dur, 280ms) ease-out,
      visibility 0s linear 0s;
  }
  .t-input.is-shaking {
    animation: t-input-shake calc(
        var(--shake-dur-a) * 2 + var(--shake-dur-b) * 2
      ) linear;
  }
  @keyframes t-input-shake {
    0%      { transform: translateX(0);                                 animation-timing-function: var(--shake-ease); }
    28.57%  { transform: translateX(var(--shake-distance));             animation-timing-function: var(--shake-ease); }
    57.14%  { transform: translateX(calc(var(--shake-distance) * -1)); animation-timing-function: var(--shake-ease); }
    78.57%  { transform: translateX(var(--shake-overshoot));            animation-timing-function: var(--shake-ease); }
    100%    { transform: translateX(0); }
  }
  .t-input-wrap { display: flex; flex-direction: column; gap: 8px; }
  .t-error-msg { color: var(--danger); font-size: 13px; }
  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .t-shimmer::before { animation: none !important; }
    .t-toast { transition: none !important; }
    .t-input { animation: none !important; transform: none !important; }
    .msg, .icon-btn.is-recording { animation: none !important; }
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <span class="bear" aria-hidden="true">🐰</span>
    <div>
      <h1>秘密基地</h1>
      <p id="status">小信差會把你的話念給孩子聽</p>
    </div>
    <button class="presence" id="presence" type="button" hidden aria-label="切換我在／我忙">我忙</button>
  </header>

  <section class="gate" id="gate" hidden>
    <form id="gate-form">
      <h2>爸爸媽媽的鑰匙</h2>
      <p>輸入設定時的家長密碼，這台手機之後就不用再輸入。</p>
      <div class="t-input-wrap" id="gate-wrap">
        <input class="t-input" id="gate-key" type="password" autocomplete="current-password" placeholder="家長密碼" required>
        <span class="t-error-msg">密碼不對，再試一次</span>
      </div>
      <button type="submit">進入</button>
    </form>
  </section>

  <nav class="kid-tabs" id="kid-tabs" role="tablist" hidden></nav>
  <main class="thread" id="thread" hidden></main>

  <footer class="composer" id="composer" hidden>
    <div class="chips" id="chips">
      <button class="chip" type="button">我收到了，謝謝你跟我說 💛</button>
      <button class="chip" type="button">你好勇敢，願意說出來</button>
      <button class="chip" type="button">晚上睡前我們抱抱聊聊好不好？</button>
      <button class="chip" type="button">不管生氣還是難過，我都愛你</button>
    </div>
    <div class="rec-preview" id="rec-preview">
      <audio id="rec-audio" controls></audio>
      <button class="icon-btn" id="rec-discard" type="button" aria-label="刪掉這段錄音">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
      </button>
    </div>
    <div class="attach-preview" id="attach-preview">
      <img id="attach-img" alt="" hidden>
      <span class="big" id="attach-big" hidden></span>
      <div class="what"><b id="attach-title"></b><span id="attach-sub"></span></div>
      <button class="icon-btn" id="attach-discard" type="button" aria-label="拿掉附件">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sticker-tray" id="sticker-tray"></div>
    <div class="to-line">
      <span id="to-label">回給虎妞</span>
      <label class="both"><input type="checkbox" id="both"> 兩個都聽</label>
    </div>
    <div class="attach-row">
      <button class="attach-btn" id="photo-btn" type="button">📷 照片</button>
      <button class="attach-btn" id="sticker-btn" type="button" aria-expanded="false">🌟 貼紙</button>
      <input id="photo-input" type="file" accept="image/*" hidden>
    </div>
    <div class="row">
      <button class="icon-btn" id="rec-btn" type="button" aria-label="錄自己的聲音">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg>
      </button>
      <textarea id="text" rows="1" placeholder="打字，會用你的聲音念給孩子聽"></textarea>
      <button class="icon-btn primary" id="send" type="button" aria-label="送出" disabled>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 16-2.5-6.5z"/></svg>
      </button>
    </div>
    <div class="hint-line" id="hint-line"><span class="rec-timer" id="rec-timer">0:00</span></div>
  </footer>
</div>
<div class="toast-dock"><div class="t-toast" id="toast" role="status"></div></div>

<script>
const ENDPOINT = "https://mzobbjuhoddruekmxzoe.supabase.co/functions/v1/secret-base";
const KEY_STORE = "secret-base-parent-key-v1";
const POLL_MS = 10000;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
const $ = id => document.getElementById(id);
const focusId = new URLSearchParams(location.hash.slice(1)).get("m");
const demo = new URLSearchParams(location.search).has("demo");
let parentKey = store.get(KEY_STORE);
let presence = "away";
let messages = [];
let kids = demo ? [{ id: "huniu", name: "虎妞" }, { id: "pihai", name: "屁孩" }] : [];
let activeKid = null;
const SEEN_STORE = "secret-base-parent-seen-v1"; // 每個孩子最後看過的悄悄話時間，用來亮小紅點
const seen = (() => { try { return JSON.parse(store.get(SEEN_STORE) || "{}"); } catch { return {}; } })();
const kidName = id => (kids.find(k => k.id === id) || {}).name || "孩子";
let recorder = null, recChunks = [], recBlob = null, recStartedAt = 0, recTick = 0;
let sending = false;
let pollTimer = 0;
const rendered = new Map();

const cs = getComputedStyle(document.documentElement);
const ms = (name, fb) => { const v = parseFloat(cs.getPropertyValue(name)); return Number.isFinite(v) ? v : fb; };

// ---------- 登入 ----------
function showGate() {
  $("gate").hidden = false;
  $("thread").hidden = $("composer").hidden = $("kid-tabs").hidden = true;

// 相簿原圖動輒好幾 MB，縮到長邊 1280 的 JPEG 再上傳；iPad 看起來一樣清楚，後端上限 6MB
async function shrinkPhoto(file) {
  const bitmap = await createImageBitmap(file).catch(() => null);
  const source = bitmap || await new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
  const w = source.width, h = source.height;
  const scale = Math.min(1, 1280 / Math.max(w, h));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(w * scale);
  canvas.height = Math.round(h * scale);
  canvas.getContext("2d").drawImage(source, 0, 0, canvas.width, canvas.height);
  bitmap?.close?.();
  const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.82));
  if (!blob) throw new Error("toBlob failed");
  return blob;
}

// 兩分鐘約 5MB，在後端 10MB 的上限內。轉不了就照原樣送，至少不會卡住回信。
async function toPlayableBlob(blob) {
  if (/mp4|mpeg|wav|aac/.test(blob.type)) return blob;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const decoded = await ctx.decodeAudioData(await blob.arrayBuffer());
    ctx.close?.();
    const rate = 22050;
    const offline = new OfflineAudioContext(1, Math.max(1, Math.ceil(decoded.duration * rate)), rate);
    const src = offline.createBufferSource();
    src.buffer = decoded;
    src.connect(offline.destination);
    src.start();
    const mono = (await offline.startRendering()).getChannelData(0);
    return new Blob([wavBytes(mono, rate)], { type: "audio/wav" });
  } catch (error) {
    console.warn("transcode failed", error);
    return blob;
  }
}
function wavBytes(samples, rate) {
  const buf = new ArrayBuffer(44 + samples.length * 2);
  const v = new DataView(buf);
  const str = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  str(0, "RIFF"); v.setUint32(4, 36 + samples.length * 2, true); str(8, "WAVE");
  str(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, "data"); v.setUint32(40, samples.length * 2, true);
  for (let i = 0; i < samples.length; i++) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(44 + i * 2, s < 0 ? s * 32768 : s * 32767, true);
  }
  return buf;
}

    refreshSend();
    return;
  }
  const form = new FormData();
  if (body) form.append("text", body);
  if (recBlob) form.append("audio", recBlob, `parent.${recBlob.type.includes("mp4") ? "m4a" : recBlob.type.includes("wav") ? "wav" : "webm"}`);
  if (photoBlob) form.append("photo", photoBlob, "photo.jpg");
  if (sticker) form.append("sticker", sticker);
  form.append("to", $("both").checked ? "both" : activeKid);
  const lastKid = [...messages].reverse().find(m => m.sender === "kid" && m.kid === activeKid);
  if (lastKid) form.append("reply_to", lastKid.id);
  try {
    const res = await fetch(`${ENDPOINT}/parent/reply`, { method: "POST", headers: { "x-base-key": parentKey }, body: form });
    if (!res.ok) throw new Error(`reply ${res.status}`);
    text.value = "";
    text.style.height = "";
    $("rec-discard").click();
    setAttachment();
    toast($("both").checked ? "送出了，兩個人都會收到 ✉️" : `送出了，小信差正把信送去給${kidName(activeKid)} ✉️`);
    $("both").checked = false;
    await load();
    render();
  } catch (error) {
    console.warn(error);
    toast("沒送出去，再試一次");
  } finally {
    sending = false;
    hint.innerHTML = '<span class="rec-timer" id="rec-timer">0:00</span>';
    refreshSend();
  }
});

let toastTimer = 0;
function toast(message) {
  const el = $("toast");
  el.textContent = message;
  el.classList.add("is-open");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("is-open"), 2600);
}

// ---------- 示範模式：跟同一台電腦的 /secret-base/?demo 互通 ----------
const demoChannel = demo && window.BroadcastChannel ? new BroadcastChannel("secret-base-demo") : null;
let baseOpen = false;
demoChannel?.addEventListener("message", ({ data }) => {
  if (data.type === "base-here") { baseOpen = true; $("status").textContent = "示範模式 · 已連上孩子頁"; }
  if (data.type === "kid") {
    baseOpen = true;
    messages.push({ id: data.id, sender: "kid", kid: "huniu", body: null, audio_url: URL.createObjectURL(data.blob), created_at: data.at });
    render();
    toast("🐰 虎妞在秘密基地說話了（示範模式的孩子頁算虎妞）");
  }
  if (data.type === "heard") {
    const m = messages.find(x => x.id === data.id);
    if (m) { m.heard_at = new Date().toISOString(); render(); }
  }
});

// ---------- 啟動 ----------
(async () => {
  if (demo) {
    $("status").textContent = "示範模式 · 等孩子頁打開…";
    demoChannel?.postMessage({ type: "hello" });
    enter();
    return;
  }
  if (!parentKey) { showGate(); return; }
  if (await load()) enter();
  else { store.del(KEY_STORE); showGate(); }
})();
</script>
