<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>島嶼迷宮</title>
<meta name="description" content="用石牆在島上排出迷宮，讓從海上來的怪物繞遠路。30 波，看你能不能守住整座島。">
<meta property="og:title" content="島嶼迷宮｜你能撐到第幾波？">
<meta property="og:description" content="用石牆在島上排出迷宮，讓從海上來的怪物繞遠路。30 波，看你能不能守住整座島。">
<meta property="og:image" content="https://coomysf.github.io/maze-td/og.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #222a36; --muted: #66707e; --paper: rgba(255, 252, 246, .94); --line: rgba(34, 42, 54, .12);
    --accent: #1f8f87; --coral: #e0735a; --gold: #e3a92b; --bad: #d8483a;
    --ease: cubic-bezier(.22, 1, .36, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd4ec; color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    touch-action: none; user-select: none; -webkit-user-select: none; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #tags { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .tag { position: absolute; transform: translate(-50%, -100%); font: 800 11px "Noto Sans TC", sans-serif; white-space: nowrap;
    padding: 2px 8px; border-radius: 999px; background: rgba(255, 252, 246, .92); color: var(--ink); box-shadow: 0 3px 10px rgba(0,0,0,.15); }
  .tag b { color: var(--coral); margin-right: 4px; }
  .pop { position: absolute; transform: translate(-50%, -50%); font: 900 13px "Noto Sans TC", sans-serif; color: #ffd36b;
    text-shadow: 0 1px 0 #7a4b00, 0 0 6px rgba(0,0,0,.35); pointer-events: none; animation: pop .9s var(--ease) forwards; }
  @keyframes pop { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -26px; } }

  /* HUD */
  .hud { position: fixed; left: 0; right: 0; top: 0; padding: max(10px, env(safe-area-inset-top)) 12px 0; display: flex; gap: 8px; align-items: center; pointer-events: none; }
  .stat { pointer-events: auto; display: inline-flex; align-items: center; gap: 5px; background: var(--paper); border-radius: 999px; padding: 6px 11px;
    font: 800 13px "Noto Sans TC", sans-serif; box-shadow: 0 4px 14px rgba(0,0,0,.12); white-space: nowrap; }
  .stat small { font-weight: 700; color: var(--muted); font-size: 11px; }
  .stat.lives i { color: var(--bad); font-style: normal; }
  .stat.gold i { color: var(--gold); font-style: normal; }
  .stat.hit { animation: shake .35s ease; background: #ffe1db; }
  @keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
  .hud .grow { flex: 1; }
  .icon-btn { pointer-events: auto; border: 0; background: var(--paper); border-radius: 999px; min-width: 38px; height: 34px; padding: 0 10px; cursor: pointer;
    font: 900 13px "Noto Sans TC", sans-serif; color: var(--ink); box-shadow: 0 4px 14px rgba(0,0,0,.12); }
  .icon-btn[aria-pressed="true"] { background: var(--ink); color: #fff; }

  .maze-len { position: fixed; left: 50%; top: calc(max(10px, env(safe-area-inset-top)) + 44px); transform: translateX(-50%); pointer-events: none;
    font: 700 12px "Noto Sans TC", sans-serif; color: var(--ink); background: rgba(255,252,246,.78); padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .maze-len b { color: var(--accent); font-size: 14px; }

  /* 底部：下一波與建造列 */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 10px max(10px, env(safe-area-inset-bottom)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; pointer-events: none; }
  .wave-row { display: flex; gap: 8px; align-items: stretch; pointer-events: auto; max-width: 620px; width: 100%; margin: 0 auto; }
  .next-info { flex: 1; min-width: 0; background: var(--paper); border-radius: 14px; padding: 7px 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
  .next-info small { display: block; font: 700 11px "Noto Sans TC", sans-serif; color: var(--muted); }
  .next-info span { display: block; font: 800 13px/1.35 "Noto Sans TC", sans-serif; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .go { border: 0; cursor: pointer; border-radius: 14px; padding: 0 18px; background: var(--accent); color: #fff; font: 900 15px "Noto Sans TC", sans-serif;
    box-shadow: 0 6px 18px rgba(31, 143, 135, .35); transition: transform .15s var(--ease), opacity .2s; min-height: 48px; }
  .go:active { transform: scale(.96); }
  .go:disabled { opacity: .45; cursor: default; box-shadow: none; }
  .tools { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; pointer-events: auto; max-width: 620px; width: 100%; margin: 0 auto; padding: 2px 2px 4px; scrollbar-width: none; }
  .tools::-webkit-scrollbar { display: none; }
  .tool { min-width: 0; border: 2px solid transparent; cursor: pointer; background: var(--paper); border-radius: 14px; padding: 6px 4px 5px; text-align: center;
    box-shadow: 0 4px 14px rgba(0,0,0,.12); color: var(--ink); transition: transform .15s var(--ease), border-color .15s; min-height: 62px; }
  .tool .sw { display: block; width: 18px; height: 18px; border-radius: 6px; margin: 0 auto 3px; }
  .tool b { display: block; font: 800 12px "Noto Sans TC", sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 420px) { .tool { padding: 5px 2px 4px; } .tool b { font-size: 11px; letter-spacing: -.02em; } .tool small { font-size: 10px; } }
  .tool small { display: block; font: 700 11px "Noto Sans TC", sans-serif; color: var(--gold); }
  .tool[aria-pressed="true"] { border-color: var(--ink); transform: translateY(-3px); }
  .tool.poor { opacity: .5; }
  .tool.locked { opacity: .35; }

  /* 塔的資訊卡 */
  .sheet { position: fixed; left: 50%; bottom: calc(max(10px, env(safe-area-inset-bottom)) + 140px); transform: translate(-50%, 10px); width: min(340px, calc(100% - 20px));
    background: var(--paper); border-radius: 16px; padding: 12px 14px; box-shadow: 0 12px 34px rgba(0,0,0,.22); opacity: 0; pointer-events: none;
    transition: opacity .25s var(--ease), transform .3s var(--ease); }
  .sheet.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .sheet h3 { margin: 0; font: 900 16px "Noto Sans TC", sans-serif; }
  .sheet p { margin: 4px 0 10px; font: 500 13px/1.6 "Noto Sans TC", sans-serif; color: var(--muted); }
  .sheet .row { display: flex; gap: 8px; }
  .sheet button { flex: 1; border: 0; cursor: pointer; border-radius: 12px; min-height: 44px; font: 800 13px "Noto Sans TC", sans-serif; }
  .sheet .up { background: var(--accent); color: #fff; }
  .sheet .up:disabled { opacity: .4; cursor: default; }
  .sheet .sell { background: #efe7da; color: var(--ink); }
  .sheet .x { flex: 0 0 44px; background: transparent; color: var(--muted); font-size: 18px; }

  .toast { position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%) scale(.96); background: rgba(34, 42, 54, .9); color: #fff; padding: 10px 16px;
    border-radius: 12px; font: 800 14px "Noto Sans TC", sans-serif; opacity: 0; pointer-events: none; transition: opacity .2s, transform .25s var(--ease); text-align: center; max-width: 86vw; }
  .toast.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .banner { position: fixed; left: 50%; top: 24%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; opacity: 0; transition: opacity .4s var(--ease); }
  .banner.on { opacity: 1; }
  .banner small { display: inline-block; font: 800 12px "Noto Sans TC", sans-serif; letter-spacing: .2em; color: #fff; background: var(--coral); padding: 3px 12px; border-radius: 999px; }
  .banner b { display: block; margin-top: 8px; font: 900 clamp(28px, 7vw, 44px)/1.2 "Noto Serif TC", serif; color: #fff; text-shadow: 0 2px 0 rgba(34,42,54,.55), 0 3px 18px rgba(0,0,0,.45); }

  /* 開場與結算 */
  .modal { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px; background: rgba(20, 34, 52, .42); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none; transition: opacity .35s var(--ease); overflow-y: auto; }
  .modal.on { opacity: 1; pointer-events: auto; }
  .card { width: min(420px, 100%); background: var(--paper); border-radius: 22px; padding: 26px 22px 20px; box-shadow: 0 24px 60px rgba(0,0,0,.28); text-align: center; }
  .card .kick { font: 800 12px "Noto Sans TC", sans-serif; letter-spacing: .24em; color: var(--accent); }
  .card h1, .card h2 { margin: 8px 0 6px; font: 900 clamp(30px, 8vw, 40px)/1.2 "Noto Serif TC", serif; }
  .card .lead { margin: 0 0 16px; font: 500 14px/1.75 "Noto Sans TC", sans-serif; color: var(--muted); }
  .card ol { text-align: left; margin: 0 0 18px; padding: 0 0 0 22px; font: 500 14px/1.7 "Noto Sans TC", sans-serif; }
  .card ol b { color: var(--ink); }
  .card .btns { display: grid; gap: 8px; }
  .card button, .card a.btn { border: 0; cursor: pointer; border-radius: 14px; min-height: 48px; font: 900 15px "Noto Sans TC", sans-serif; text-decoration: none;
    display: flex; align-items: center; justify-content: center; }
  .card .primary { background: var(--accent); color: #fff; box-shadow: 0 6px 18px rgba(31, 143, 135, .35); }
  .card .secondary { background: #efe7da; color: var(--ink); }
  .card .link { background: transparent; color: var(--muted); font-weight: 700; font-size: 13px; min-height: 40px; }
  .result-img { width: 100%; border-radius: 14px; display: block; margin: 0 0 14px; box-shadow: 0 6px 20px rgba(0,0,0,.15); }
  .card .note { font: 700 12px "Noto Sans TC", sans-serif; color: var(--accent); min-height: 18px; margin: 6px 0 0; }

  @media (min-width: 900px) {
    .sheet { bottom: 160px; }
  }
  /* 橫拿手機：建造列改成右側直欄，把高度留給島 */
  body.side .hud { right: 222px; }
  body.side .maze-len { left: calc((100% - 222px) / 2); }
  body.side .dock { left: auto; top: 0; width: 222px; padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) 0;
    align-content: end; }
  body.side .wave-row { flex-direction: column; }
  body.side .go { min-height: 44px; }
  body.side .tools { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  body.side .tool { min-height: 48px; padding: 4px 2px; }
  body.side .tool .sw { width: 12px; height: 12px; display: inline-block; margin: 0 4px 0 0; vertical-align: -1px; }
  body.side .tool b { display: inline; }
  body.side .sheet { left: calc((100% - 222px) / 2); bottom: max(10px, env(safe-area-inset-bottom)); }
  body.side .card { padding: 18px 18px 14px; }
  body.side .card ol { font-size: 13px; line-height: 1.55; margin-bottom: 12px; }
  body.side .card .lead { margin-bottom: 10px; font-size: 13px; }
  body.side .modal { place-items: start center; }
  body.side .banner { left: calc((100% - 222px) / 2); top: 48%; }
  body.side .next-info span { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  body.side #m-end .card { width: min(640px, 100%); display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; text-align: left; align-items: center; }
  body.side #m-end .kick, body.side #m-end h2 { grid-column: 2; }
  body.side #m-end .result-img { grid-column: 1; grid-row: 1 / span 4; margin: 0; max-height: calc(100vh - 60px); object-fit: contain; }
  body.side #m-end .btns, body.side #m-end .note { grid-column: 2; }
  body.side #m-end h2 { font-size: 26px; }

</style>
</head>
<body>
<div id="stage"></div>
<div id="tags"></div>

<div class="hud">
  <span class="stat"><small>波</small><span id="h-wave">0/30</span></span>
  <span class="stat lives" id="h-lives-wrap"><i>♥</i><span id="h-lives">20</span></span>
  <span class="stat gold"><i>●</i><span id="h-gold">0</span></span>
  <span class="grow"></span>
  <button class="icon-btn" id="b-speed" type="button" aria-label="遊戲速度">×1</button>
  <button class="icon-btn" id="b-pause" type="button" aria-label="暫停">II</button>
</div>
<div class="maze-len">迷宮長度 <b id="h-len">0</b> 格</div>

<div class="dock">
  <div class="wave-row">
    <div class="next-info"><small id="n-kick">下一波 · 第 1 波</small><span id="n-desc">螃蟹</span></div>
    <button class="go" id="b-go" type="button">出發 ▶</button>
  </div>
  <div class="tools" id="tools" role="toolbar" aria-label="建造"></div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-label="建築資訊">
  <h3 id="s-title"></h3>
  <p id="s-desc"></p>
  <div class="row">
    <button class="up" id="s-up" type="button"></button>
    <button class="sell" id="s-sell" type="button"></button>
    <button class="x" id="s-close" type="button" aria-label="關閉">✕</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="banner" id="banner"><small id="bn-kick"></small><b id="bn-title"></b></div>

<div class="modal on" id="m-start">
  <div class="card">
    <div class="kick">COOMY · 動畫實驗室</div>
    <h1>島嶼迷宮</h1>
    <p class="lead">怪物從港口登陸，要依序繞過燈塔、市政廳、風車，再從南邊的橋溜走。用石牆在島上排出迷宮，讓牠們走得越遠越好。</p>
    <ol>
      <li>選<b>石牆</b>，在島上點或拖曳，排出迷宮。</li>
      <li>路<b>不能堵死</b>，至少要留一條給怪物走。</li>
      <li>在石牆上蓋<b>塔</b>，只付差價。空中怪會飛過迷宮，記得蓋能打空的塔。</li>
      <li>漏一隻扣一條命，撐過 <b>30 波</b>就守住了。</li>
    </ol>
    <div class="btns">
      <button class="primary" id="b-start" type="button">開始守島</button>
      <button class="secondary" id="b-resume" type="button" hidden></button>
      <a class="link btn" href="/lab/">← 回到動畫實驗室</a>
    </div>
  </div>
</div>

<div class="modal" id="m-pause">
  <div class="card">
    <div class="kick">暫停</div>
    <h2>喘口氣</h2>
    <p class="lead">每打完一波會自動存檔，關掉頁面下次也能接著玩。</p>
    <div class="btns">
      <button class="primary" id="b-unpause" type="button">繼續</button>
      <button class="secondary" id="b-restart" type="button">重新開始</button>
      <a class="link btn" href="/lab/">← 回到動畫實驗室</a>
    </div>
  </div>
</div>

<div class="modal" id="m-end">
  <div class="card">
    <div class="kick" id="e-kick">結算</div>
    <h2 id="e-title"></h2>
    <img class="result-img" id="e-img" alt="這一局的分享圖">
    <div class="btns">
      <button class="primary" id="b-save" type="button">存成分享圖</button>
      <button class="secondary" id="b-copy" type="button">複製挑戰文</button>
      <button class="link" id="b-again" type="button">再玩一次</button>
    </div>
    <p class="note" id="e-note"></p>
  </div>
</div>

<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ================= 規則資料 ================= */
const W = 15, H = 23;
const START = [7, 0], EXIT = [7, H - 1];
// 依序要經過的點；最後一個是出口
const WAYPOINTS = [[0, 5], [W - 1, 11], [0, 17], EXIT];
const LANDMARKS = [
  { name: '燈塔', cell: WAYPOINTS[0], at: [-2.2, 5], kind: 'lighthouse' },
  { name: '市政廳', cell: WAYPOINTS[1], at: [W + 1.4, 11], kind: 'hall' },
  { name: '風車', cell: WAYPOINTS[2], at: [-2.2, 17], kind: 'windmill' },
];
const START_LIVES = 20, START_GOLD = 70, LAST_WAVE = 30, SAVE_KEY = 'island-maze-save-v1';

// range 以格為單位；air/ground 決定打得到誰
const TOWERS = {
  rock:   { name: '石牆', cost: 2, color: 0x9a9488, desc: '不會攻擊，便宜，用來排迷宮。可以直接在上面蓋塔。' },
  arrow:  { name: '瞭望塔', cost: 10, color: 0xd9a066, dmg: 7, rate: .65, range: 2.6, ground: true, air: true, desc: '單體射擊，地面空中都打。' },
  cannon: { name: '砲台屋', cost: 20, color: 0xe0735a, dmg: 13, rate: 1.4, range: 2.4, splash: 1.15, ground: true, air: false, desc: '範圍傷害，只打地面。' },
  frost:  { name: '霧燈', cost: 15, color: 0x7cc4e4, dmg: 3, rate: 1.0, range: 2.2, slow: .45, slowT: 1.6, splash: .9, ground: true, air: true, desc: '讓周圍的怪變慢。珊瑚魔不吃減速。' },
  flak:   { name: '信號塔', cost: 16, color: 0xf2c94c, dmg: 26, rate: .8, range: 3.4, ground: false, air: true, desc: '只打空中，傷害很高。' },
  bell:   { name: '鐘樓', cost: 40, color: 0x8f7cc9, dmg: 18, rate: 1.25, range: 2.9, chain: 4, ground: true, air: true, unlock: 6, desc: '鐘聲連鎖打 4 隻，第 6 波開放。' },
};
const TOOL_ORDER = ['rock', 'arrow', 'cannon', 'frost', 'flak', 'bell'];
const LV_MULT = [1, 1.85, 3.3];        // 各等級傷害倍率
const UP_COST = [0, 1.2, 2.2];         // 升級費 = 建造費 × 這個倍率
const SELL_RATE = .7;

const KINDS = {
  crab:   { name: '螃蟹', hp: 1, speed: 1.55, color: 0xe2614a, desc: '一般怪' },
  hermit: { name: '鐵殼寄居蟹', hp: 1.5, speed: 1.15, armor: 4, color: 0x8d8f99, desc: '有殼，小傷害會被抵掉' },
  pirate: { name: '小海盜', hp: .62, speed: 2.6, color: 0x3f5f8a, desc: '跑得很快' },
  gull:   { name: '海鷗群', hp: .75, speed: 1.45, air: true, color: 0xf4f1ea, desc: '從空中飛過，不走迷宮' },
  coral:  { name: '珊瑚魔', hp: 1.25, speed: 1.6, noslow: true, color: 0xff8fb1, desc: '不吃減速' },
  boss:   { name: '海盜船長', hp: 14, speed: 1.05, armor: 2, boss: true, color: 0x2c3442, desc: '王，漏掉扣 5 條命' },
  boss2:  { name: '巨型章魚', hp: 16, speed: .95, armor: 3, boss: true, color: 0x9b4dca, desc: '王，漏掉扣 5 條命' },
  kraken: { name: '風暴海怪', hp: 9, speed: .85, armor: 4, boss: true, final: true, color: 0x1f6f78, desc: '大王，漏掉扣 10 條命' },
};
function waveSpec(w) {
  const base = 16 * Math.pow(1.152, w - 1);
  let kind = 'crab', count = 12;
  if (w === 30) kind = 'kraken';
  else if (w === 20) kind = 'boss2';
  else if (w === 10) kind = 'boss';
  else if (w % 10 === 5) { kind = 'gull'; count = 10; }
  else if (w % 10 === 7) { kind = 'pirate'; count = 16; }
  else if (w % 10 === 9) kind = 'coral';
  else if (w % 10 === 4 || w % 10 === 2 && w > 10) kind = 'hermit';
  const k = KINDS[kind];
  const escort = k.boss ? (w === 30 ? 10 : 6) : 0;
  return { w, kind, count: k.boss ? 1 : count, escort, hp: base * k.hp, gap: k.boss ? 0 : (kind === 'pirate' ? .45 : .7),
    bounty: k.boss ? 25 + w : 1 + Math.floor(w / 6), bonus: 6 + Math.floor(w * 1.3) };
}
const waveText = (w) => {
  const s = waveSpec(w), k = KINDS[s.kind];
  return `${k.name}${s.count > 1 ? ` × ${s.count}` : ''}${s.escort ? `＋護衛 ${s.escort}` : ''}——${k.desc}`;
};

/* ================= 狀態 ================= */
const S = {
  phase: 'title', wave: 0, lives: START_LIVES, gold: START_GOLD,
  grid: new Array(W * H).fill(null),   // 每格：null 或 { type, lvl, mesh, cd }
  creeps: [], shots: [], fx: [], spawnQ: [],
  tool: 'rock', speed: 1, paused: false,
  stats: { maxLen: 0, built: 0, kills: 0, leaks: 0 },
};
const idx = (x, y) => y * W + x;
const inGrid = (x, y) => x >= 0 && y >= 0 && x < W && y < H;
const RESERVED = new Set([idx(...START), ...WAYPOINTS.map(c => idx(...c))]);

/* ================= 尋路：每個目標一張距離場 ================= */
const DIRS = [[0, 1], [1, 0], [-1, 0], [0, -1]];
function distField(target, blocked) {
  const d = new Int16Array(W * H).fill(-1);
  const q = [target]; d[idx(...target)] = 0;
  for (let h = 0; h < q.length; h++) {
    const [x, y] = q[h], v = d[idx(x, y)];
    for (const [dx, dy] of DIRS) {
      const nx = x + dx, ny = y + dy;
      if (!inGrid(nx, ny)) continue;
      const i = idx(nx, ny);
      if (d[i] !== -1 || blocked(i)) continue;
      d[i] = v + 1; q.push([nx, ny]);
    }
  }
  return d;
}
let FIELDS = [];
function computeFields(extraBlock = -1) {
  const blocked = (i) => i === extraBlock || !!S.grid[i];
  return WAYPOINTS.map(t => distField(t, blocked));
}
// 從起點沿距離場走一遍，回傳整條路（格子陣列）；任一段走不通回傳 null
function tracePath(fields) {
  const path = [START.slice()];
  let cur = START.slice(), prevDir = [0, 1];
  for (let leg = 0; leg < WAYPOINTS.length; leg++) {
    const f = fields[leg];
    if (f[idx(...cur)] < 0) return null;
    while (f[idx(...cur)] > 0) {
      const nx = stepDir(f, cur, prevDir);
      prevDir = [nx[0] - cur[0], nx[1] - cur[1]];
      cur = nx; path.push(cur);
    }
  }
  return path;
}
// 沿距離場往下一格；同分時優先維持原方向，路線比較順
function stepDir(f, [x, y], prev) {
  const v = f[idx(x, y)];
  const order = [prev, ...DIRS.filter(d => d[0] !== prev[0] || d[1] !== prev[1])];
  for (const [dx, dy] of order) {
    const nx = x + dx, ny = y + dy;
    if (inGrid(nx, ny) && f[idx(nx, ny)] === v - 1) return [nx, ny];
  }
  return [x, y];
}

  const g = new THREE.Group(), p = cellPos(l.at[0], l.at[1]);
  if (l.kind === 'lighthouse') {
    g.add(mesh(new THREE.CylinderGeometry(.42, .55, .5, 8), M.stone, 0, .25, 0));
    for (let i = 0; i < 4; i++) g.add(mesh(new THREE.CylinderGeometry(.36 - i * .03, .4 - i * .03, .45, 8), i % 2 ? M.white : M.red, 0, .72 + i * .45, 0));
    g.add(mesh(new THREE.CylinderGeometry(.3, .3, .32, 8), M.glass, 0, 2.48, 0));
    g.add(mesh(new THREE.ConeGeometry(.38, .4, 8), M.red, 0, 2.84, 0));
  } else if (l.kind === 'hall') {
    g.add(mesh(new THREE.BoxGeometry(1.6, .9, 1.3), M.cream, 0, .45, 0));
    g.add(mesh(new THREE.BoxGeometry(1.75, .12, 1.45), M.white, 0, .96, 0));
    g.add(mesh(new THREE.CylinderGeometry(.36, .4, .5, 10), M.cream, 0, 1.25, 0));
    g.add(mesh(new THREE.SphereGeometry(.4, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2), M.coral, 0, 1.5, 0));
    for (let i = -1; i <= 1; i++) g.add(mesh(new THREE.BoxGeometry(.22, .3, .04), M.glass, i * .45, .5, .66, false));
  } else {
    g.add(mesh(new THREE.CylinderGeometry(.35, .55, 1.6, 8), M.cream, 0, .8, 0));
    g.add(mesh(new THREE.ConeGeometry(.45, .5, 8), M.coral, 0, 1.85, 0));
    const blades = new THREE.Group(); blades.position.set(0, 1.45, .45);
    for (let i = 0; i < 4; i++) { const b = mesh(new THREE.BoxGeometry(.12, 1.1, .03), M.white, 0, .55, 0); const a = new THREE.Group(); a.rotation.z = i * Math.PI / 2; a.add(b); blades.add(a); }
    g.add(blades); g.userData.blades = blades;

  g.position.copy(p); scene.add(g); l.group = g;

  flag.add(mesh(new THREE.CylinderGeometry(.02, .02, .7, 5), M.wood, 0, .35, 0));
  flag.add(mesh(new THREE.BoxGeometry(.28, .18, .02), M.coral, .14, .6, 0));

}

/* ---------- 路線預覽：沿路排小光點 ---------- */
const DOTS_MAX = W * H * 2;
const dots = new THREE.InstancedMesh(new THREE.CircleGeometry(.07, 8).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .85 }), DOTS_MAX);
dots.count = 0; scene.add(dots);
let PATH = [];
function refreshPath() {
  FIELDS = computeFields();
  PATH = tracePath(FIELDS) || [];
  const len = Math.max(0, PATH.length - 1);
  S.stats.maxLen = Math.max(S.stats.maxLen, len);
}
// 空中怪不走迷宮：下一波（或這一波）是空中時，改畫牠們的直線航線
const AIR_ROUTE = [cellPos(...START).add(new THREE.Vector3(0, 0, -1.6)), ...WAYPOINTS.map(c => cellPos(...c))];
const airMode = () => { const w = S.phase === 'wave' ? S.wave : S.wave + 1; return w <= LAST_WAVE && !!KINDS[waveSpec(w).kind].air; };
function drawDots(t) {
  const m4 = new THREE.Matrix4(); let n = 0;
  const phase = (t * 1.6) % 1;
  const air = airMode();
  dots.material.color.set(air ? 0x9fe3ff : 0xffffff);
  if (air) {
    for (let s = 0; s < AIR_ROUTE.length - 1; s++) {
      const a = AIR_ROUTE[s], b = AIR_ROUTE[s + 1], L = a.distanceTo(b);
      for (let d = phase * .7; d < L && n < DOTS_MAX; d += .7) { const p = a.clone().lerp(b, d / L); m4.makeTranslation(p.x, .06, p.z); dots.setMatrixAt(n++, m4); }
    }
    dots.count = n; dots.instanceMatrix.needsUpdate = true; return;
  }
  for (let i = 0; i < PATH.length - 1 && n < DOTS_MAX; i++) {
    const a = cellPos(...PATH[i]), b = cellPos(...PATH[i + 1]);
    for (const f of [phase * .5, .5 + phase * .5]) {
      const p = a.clone().lerp(b, f);
      m4.makeTranslation(p.x, .05, p.z); dots.setMatrixAt(n++, m4);
    }
  }
  dots.count = n; dots.instanceMatrix.needsUpdate = true;
}

/* ---------- 建築模型 ---------- */
function buildMesh(type, lvl) {
  const g = new THREE.Group(), T = TOWERS[type];
  if (type === 'rock') {
    g.add(mesh(new THREE.BoxGeometry(.92, .34, .92), M.stone, 0, .17, 0));
    g.add(mesh(new THREE.DodecahedronGeometry(.22, 0), mat(0xb0a99b), -.12, .4, .08));
    g.add(mesh(new THREE.DodecahedronGeometry(.17, 0), mat(0x8c8579), .17, .38, -.1));
    return g;
  }
  g.add(mesh(new THREE.BoxGeometry(.92, .26, .92), M.stone, 0, .13, 0));
  const body = mat(T.color);
  if (type === 'arrow') {
    g.add(mesh(new THREE.CylinderGeometry(.22, .3, .9, 6), M.cream, 0, .7, 0));
    g.add(mesh(new THREE.CylinderGeometry(.34, .34, .12, 6), M.wood, 0, 1.18, 0));
    g.add(mesh(new THREE.ConeGeometry(.36, .36, 6), body, 0, 1.42, 0));
  } else if (type === 'cannon') {
    g.add(mesh(new THREE.BoxGeometry(.7, .45, .7), M.cream, 0, .48, 0));
    g.add(mesh(new THREE.ConeGeometry(.55, .4, 4).rotateY(Math.PI / 4), body, 0, .9, 0));
    const barrel = mesh(new THREE.CylinderGeometry(.09, .11, .55, 8), M.dark, 0, .55, .38); barrel.rotation.x = Math.PI / 2.4; g.add(barrel); g.userData.aim = barrel;
  } else if (type === 'frost') {
    g.add(mesh(new THREE.CylinderGeometry(.08, .12, 1.05, 6), M.dark, 0, .78, 0));
    const lamp = mesh(new THREE.OctahedronGeometry(.24, 0), mat(T.color, { emissive: 0x7cc4e4, emissiveIntensity: .6 }), 0, 1.42, 0); g.add(lamp); g.userData.spin = lamp;
  } else if (type === 'flak') {
    g.add(mesh(new THREE.CylinderGeometry(.06, .2, 1.3, 4), M.wood, 0, .9, 0));
    g.add(mesh(new THREE.BoxGeometry(.5, .06, .06), M.wood, 0, 1.25, 0));
    const dish = mesh(new THREE.ConeGeometry(.28, .2, 10), body, 0, 1.62, 0); dish.rotation.x = Math.PI; g.add(dish); g.userData.spin = dish;
  } else if (type === 'bell') {
    g.add(mesh(new THREE.BoxGeometry(.56, 1.05, .56), M.cream, 0, .78, 0));
    g.add(mesh(new THREE.BoxGeometry(.66, .1, .66), M.white, 0, 1.33, 0));
    g.add(mesh(new THREE.ConeGeometry(.46, .55, 4).rotateY(Math.PI / 4), body, 0, 1.66, 0));
    g.add(mesh(new THREE.CylinderGeometry(.1, .16, .2, 8), mat(0xe3c25a, { metalness: .5, roughness: .4 }), 0, 1.15, .3, false));
  }
  for (let i = 0; i < lvl; i++) g.add(mesh(new THREE.SphereGeometry(.07, 6, 4), mat(0xffd36b, { emissive: 0xffb020, emissiveIntensity: .5 }), -.18 + i * .36, .3, .42, false));
  g.scale.setScalar(1 + lvl * .06);
  return g;
}

/* ---------- 怪物模型 ---------- */
function creepMesh(kind) {
  const k = KINDS[kind], g = new THREE.Group(), body = mat(k.color);
  const s = (k.final ? 1.7 : k.boss ? 1.35 : 1) * 1.3;
  if (kind === 'gull') {
    g.add(mesh(new THREE.SphereGeometry(.16, 8, 6), body, 0, 0, 0));
    const wl = mesh(new THREE.BoxGeometry(.42, .03, .14), body, -.24, .02, 0), wr = mesh(new THREE.BoxGeometry(.42, .03, .14), body, .24, .02, 0);
    g.add(wl, wr); g.userData.wings = [wl, wr];
    g.add(mesh(new THREE.ConeGeometry(.05, .14, 5).rotateX(Math.PI / 2), mat(0xf2a541), 0, 0, .2));
  } else if (kind === 'pirate') {
    g.add(mesh(new THREE.CapsuleGeometry(.14, .22, 3, 8), mat(0xf4ead6), 0, .3, 0));
    g.add(mesh(new THREE.CylinderGeometry(.2, .2, .06, 8), body, 0, .55, 0));
    g.add(mesh(new THREE.BoxGeometry(.3, .1, .3), body, 0, .6, 0));
  } else if (kind === 'hermit') {
    g.add(mesh(new THREE.ConeGeometry(.26, .4, 7), body, 0, .32, -.04));
    g.add(mesh(new THREE.SphereGeometry(.14, 8, 6), mat(0xe2614a), 0, .14, .14));
  } else if (kind === 'coral') {
    g.add(mesh(new THREE.IcosahedronGeometry(.22, 0), body, 0, .24, 0));
    for (let i = 0; i < 4; i++) g.add(mesh(new THREE.ConeGeometry(.05, .22, 5), body, Math.cos(i * 1.6) * .14, .46, Math.sin(i * 1.6) * .14));
  } else if (kind === 'boss2') {
    g.add(mesh(new THREE.SphereGeometry(.3, 10, 8), body, 0, .42, 0));
    for (let i = 0; i < 6; i++) { const t = mesh(new THREE.CapsuleGeometry(.05, .26, 2, 6), body, Math.cos(i) * .24, .14, Math.sin(i) * .24); t.rotation.z = Math.cos(i) * .7; t.rotation.x = Math.sin(i) * .7; g.add(t); }
    g.add(mesh(new THREE.SphereGeometry(.06, 6, 4), M.white, -.1, .5, .26, false), mesh(new THREE.SphereGeometry(.06, 6, 4), M.white, .1, .5, .26, false));
  } else if (kind === 'kraken') {
    g.add(mesh(new THREE.ConeGeometry(.34, .9, 9), body, 0, .6, 0));
    for (let i = 0; i < 8; i++) { const t = mesh(new THREE.CapsuleGeometry(.06, .4, 2, 6), mat(0x2a8f9a), Math.cos(i * .8) * .3, .14, Math.sin(i * .8) * .3); t.rotation.z = Math.cos(i * .8) * 1.1; t.rotation.x = Math.sin(i * .8) * 1.1; g.add(t); }
    g.add(mesh(new THREE.SphereGeometry(.07, 6, 4), mat(0xffe066, { emissive: 0xffd000, emissiveIntensity: .8 }), -.12, .62, .26, false), mesh(new THREE.SphereGeometry(.07, 6, 4), mat(0xffe066, { emissive: 0xffd000, emissiveIntensity: .8 }), .12, .62, .26, false));
  } else if (kind === 'boss') {
    g.add(mesh(new THREE.CapsuleGeometry(.18, .26, 3, 8), mat(0x6b3b2a), 0, .34, 0));
    g.add(mesh(new THREE.SphereGeometry(.15, 8, 6), mat(0xf1c8a0), 0, .68, 0));
    g.add(mesh(new THREE.CylinderGeometry(.08, .32, .14, 3), body, 0, .86, 0));
  } else {
    g.add(mesh(new THREE.SphereGeometry(.2, 8, 5).scale(1.2, .6, 1), body, 0, .14, 0));
    for (const sx of [-1, 1]) g.add(mesh(new THREE.SphereGeometry(.07, 6, 4), body, sx * .24, .2, .12));
    for (const sx of [-1, 1]) g.add(mesh(new THREE.SphereGeometry(.04, 5, 4), M.dark, sx * .07, .26, .16, false));
  }
  g.scale.setScalar(s);
  // 血條（永遠面向鏡頭）
  const bar = new THREE.Group(); bar.position.y = (k.air ? .45 : .75) * s + (k.boss ? .3 : 0);
  const bg = new THREE.Mesh(new THREE.PlaneGeometry(.5, .07), new THREE.MeshBasicMaterial({ color: 0x222a36, transparent: true, opacity: .55, depthTest: false }));
  const fg = new THREE.Mesh(new THREE.PlaneGeometry(.5, .07), new THREE.MeshBasicMaterial({ color: k.boss ? 0xff5a4a : 0x6be08a, depthTest: false }));
  fg.geometry.translate(.25, 0, 0); fg.position.x = -.25; bg.renderOrder = 10; fg.renderOrder = 11;
  bar.add(bg, fg); bar.scale.setScalar(1 / s * (k.boss ? 1.6 : 1)); g.add(bar);
  g.userData.bar = bar; g.userData.fg = fg;

    let a = from;
    hitList.forEach((c, n) => { const b = c.pos.clone().setY(c.pos.y + .3); bolt(a, b, 0xc9b8ff); a = b; hit(c, dmg * Math.pow(.85, n)); });
    ring(p.clone().setY(1.2), 0xc9b8ff, .9);
    return;
  }
  if (cell.type === 'frost') {
    ring(best.pos.clone().setY(.08), 0xbfe7ff, T.splash);
    for (const c of S.creeps) if (!c.dead && inRange(T, c) && c.pos.distanceTo(best.pos) <= T.splash) hit(c, dmg, T);
    return;
  }
  S.shots.push({ type: cell.type, pos: from.clone(), from: from.clone(), target: best, dest: best.pos.clone(), dmg, t: 0, T,
    obj: shotMesh(cell.type), speed: cell.type === 'cannon' ? 7 : 13 });
}
function shotMesh(type) {
  const m = type === 'cannon' ? mesh(new THREE.SphereGeometry(.1, 8, 6), M.dark, 0, 0, 0, false)
    : type === 'flak' ? mesh(new THREE.OctahedronGeometry(.09, 0), new THREE.MeshBasicMaterial({ color: 0xffe36b }), 0, 0, 0, false)
    : mesh(new THREE.BoxGeometry(.04, .04, .32), M.wood, 0, 0, 0, false);
  scene.add(m); return m;
}
function shotTick(s, dt) {
  if (s.target && !s.target.dead) s.dest.copy(s.target.pos).setY(s.target.pos.y + (s.target.air ? 0 : .25));
  if (s.type === 'cannon') {
    // 拋物線：起點到落點，按距離算飛行時間
    s.dur = s.dur || Math.max(.35, s.from.distanceTo(s.dest) / s.speed);
    s.t += dt; const k = Math.min(1, s.t / s.dur);
    s.obj.position.copy(s.from).lerp(s.dest, k); s.obj.position.y += Math.sin(k * Math.PI) * 1.2;
    if (k >= 1) {
      ring(s.dest.clone().setY(.08), 0xffb38a, s.T.splash);
      for (const c of S.creeps) if (!c.dead && !c.air && c.pos.distanceTo(s.dest) <= s.T.splash) hit(c, s.dmg);
      return true;
    }
    return false;
  }
  const d = s.dest.clone().sub(s.obj.position), L = d.length(), step = s.speed * dt;
  s.obj.lookAt(s.dest);
  if (L <= step) { if (s.target && !s.target.dead) hit(s.target, s.dmg); return true; }
  s.obj.position.addScaledVector(d, step / L);
  return false;
}

/* ---------- 特效 ---------- */
function ring(pos, color, r) {
  const m = mesh(new THREE.RingGeometry(.8, 1, 32).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: .8, depthWrite: false }), 0, 0, 0, false);
  m.position.copy(pos); scene.add(m);
  S.fx.push({ t: 0, life: .35, obj: m, update: (e, k) => { e.obj.scale.setScalar(r * (.3 + .7 * k)); e.obj.material.opacity = .8 * (1 - k); } });
}
function bolt(a, b, color) {
  const g = new THREE.BufferGeometry().setFromPoints([a, a.clone().lerp(b, .5).add(new THREE.Vector3((Math.random() - .5) * .3, .2, (Math.random() - .5) * .3)), b]);
  const l = new THREE.Line(g, new THREE.LineBasicMaterial({ color, transparent: true }));
  scene.add(l); S.fx.push({ t: 0, life: .18, obj: l, update: (e, k) => { e.obj.material.opacity = 1 - k; } });
}
function burst(pos, color, n) {
  const geo = new THREE.TetrahedronGeometry(.07, 0), m = new THREE.MeshBasicMaterial({ color });
  for (let i = 0; i < n; i++) {
    const o = new THREE.Mesh(geo, m); o.position.copy(pos); scene.add(o);
    const v = new THREE.Vector3((Math.random() - .5) * 3, Math.random() * 2.5 + 1, (Math.random() - .5) * 3);
    S.fx.push({ t: 0, life: .6, obj: o, v, update: (e, k, dt) => { e.v.y -= 7 * dt; e.obj.position.addScaledVector(e.v, dt); e.obj.scale.setScalar(1 - k); } });
  }
}

/* ---------- 一個模擬步 ---------- */
function step(dt) {
  if (S.phase === 'wave') {
    S.waveT += dt;
    while (S.spawnQ.length && S.spawnQ[0].at <= S.waveT) spawn(S.spawnQ.shift());
  }
  for (const c of S.creeps) {
    if (c.dead) continue;
    if (moveCreep(c, dt) === 'leak') {
      c.dead = true; c.leaked = true;
      const loss = c.k.final ? 10 : c.k.boss ? 5 : 1;
      S.lives = Math.max(0, S.lives - loss); S.stats.leaks += 1;
      bump('h-lives-wrap');
      if (c.k.boss) toast(`${c.k.name}過橋了，扣 ${loss} 條命`);
    }
  }
  for (const cell of S.grid) if (cell) towerTick(cell, dt);
  S.shots = S.shots.filter(s => { const done = shotTick(s, dt); if (done) scene.remove(s.obj); return !done; });
  S.creeps = S.creeps.filter(c => { if (c.dead) scene.remove(c.mesh); return !c.dead; });
  if (S.phase === 'wave' && S.lives <= 0) return endGame(false);
  if (S.phase === 'wave' && !S.spawnQ.length && !S.creeps.length) {
    const bonus = waveSpec(S.wave).bonus;
    S.gold += bonus; S.phase = 'build';
    if (S.wave >= LAST_WAVE) return endGame(true);
    banner(`第 ${S.wave} 波守住了`, `獎金 +${bonus}`, 1400);
    save(); syncUI();
  }
}

/* ================= 存檔 ================= */
function save() {
  try {
    const towers = S.grid.map((c, i) => c && [i, c.type, c.lvl, c.spent]).filter(Boolean);
    localStorage.setItem(SAVE_KEY, JSON.stringify({ wave: S.wave, gold: S.gold, lives: S.lives, towers, stats: S.stats }));
  } catch (e) { /* 無痕或封鎖儲存時就不存 */ }
}
function loadSave() { try { return JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { return null; } }
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* 同上 */ } }
function resetBoard() {
  S.grid.forEach(c => c && scene.remove(c.mesh)); S.grid.fill(null);
  S.creeps.forEach(c => scene.remove(c.mesh)); S.creeps = []; S.spawnQ = [];
  S.shots.forEach(s => scene.remove(s.obj)); S.shots = [];
}
function newGame(data) {
  resetBoard();
  Object.assign(S, { wave: 0, lives: START_LIVES, gold: START_GOLD, phase: 'build', tool: 'rock', paused: false, stats: { maxLen: 0, built: 0, kills: 0, leaks: 0 } });
  if (data) {
    Object.assign(S, { wave: data.wave, lives: data.lives, gold: data.gold, stats: { ...S.stats, ...data.stats } });
    for (const [i, type, lvl, spent] of data.towers) {
      const m = buildMesh(type, lvl); m.position.copy(cellPos(i % W, Math.floor(i / W))); scene.add(m);
      S.grid[i] = { type, lvl, mesh: m, cd: 0, x: i % W, y: Math.floor(i / W), spent };
    }
  }
  refreshPath(); setSky(); syncUI();
  ['m-start', 'm-end', 'm-pause'].forEach(id => $(id).classList.remove('on'));
  if (!data) setTimeout(() => toast('選石牆，在島上拖曳排出迷宮'), 500);
}

/* ================= 天色：一波一波從早上走到深夜 ================= */
function setSky() {
  const k = Math.min(1, S.wave / LAST_WAVE);
  const night = Math.max(0, (k - .62) / .38) * .85;
  const dusk = Math.max(0, 1 - Math.abs(k - .62) / .2);
  skyU.night.value = night; seaU.night.value = night;
  skyU.bot.value.set(0xf7e2c4).lerp(new THREE.Color(0xff9a6b), dusk * .7);
  sun.color.set(0xfff0d8).lerp(new THREE.Color(0xff9f6a), dusk * .8);
  sun.intensity = 1.6 * (1 - night * .65);
  hemi.intensity = .8 * (1 - night * .45);
  M.glass.emissiveIntensity = night * 1.6 + dusk * .4;
}

/* ================= 結算與分享 ================= */
function titleFor(win) {
  const L = S.stats.maxLen;
  if (win && S.lives === START_LIVES) return '一隻都沒放過';
  if (win) return '守住了整座島';
  if (L >= 140) return '繞路大師';
  if (L >= 100) return '迷宮建築師';
  if (L >= 70) return '島嶼工程師';
  return '直線派新手';
}
function endGame(win) {
  S.phase = 'over'; clearSave();
  const title = titleFor(win);
  $('e-kick').textContent = win ? '破關' : `撐到第 ${S.wave} 波`;
  $('e-title').textContent = title;
  // 先拍一張當下的島，再畫成分享圖
  renderer.render(scene, camera);
  const shot = renderer.domElement.toDataURL('image/jpeg', .85);
  const img = new Image();
  img.onload = () => { $('e-img').src = shareCard(img, win, title); };
  img.src = shot;
  $('e-note').textContent = '';
  setTimeout(() => $('m-end').classList.add('on'), win ? 600 : 300);
  if (win) banner('破關', '30 波全部守住了', 2400);
}
function shareCard(img, win, title) {
  const c = document.createElement('canvas'); c.width = 1080; c.height = 1350;
  const g = c.getContext('2d');
  g.fillStyle = '#f6eedd'; g.fillRect(0, 0, 1080, 1350);
  // 島的截圖裁成上半部
  const ar = img.width / img.height, bw = 1080, bh = 760;
  let sw = img.width, sh = img.width / (bw / bh);
  if (sh > img.height) { sh = img.height; sw = sh * (bw / bh); }
  g.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, bw, bh);
  const grad = g.createLinearGradient(0, 600, 0, 760); grad.addColorStop(0, 'rgba(246,238,221,0)'); grad.addColorStop(1, '#f6eedd');
  g.fillStyle = grad; g.fillRect(0, 600, 1080, 160);
  g.textAlign = 'center';
  g.fillStyle = '#1f8f87'; g.font = '800 30px "Noto Sans TC", sans-serif'; g.fillText('島嶼迷宮', 540, 820);
  g.fillStyle = '#222a36'; g.font = '900 84px "Noto Serif TC", serif'; g.fillText(title, 540, 920);
  const items = [[win ? '30/30' : `${S.wave}`, win ? '全部守住' : '撐到第幾波'], [`${S.stats.maxLen}`, '迷宮最長（格）'], [`${S.lives}`, '剩下的命'], [`${S.stats.kills}`, '打倒的怪']];
  items.forEach(([v, k], n) => {
    const x = 150 + n * 260;
    g.fillStyle = '#222a36'; g.font = '900 64px "Noto Sans TC", sans-serif'; g.fillText(v, x, 1050);
    g.fillStyle = '#66707e'; g.font = '700 26px "Noto Sans TC", sans-serif'; g.fillText(k, x, 1094);
  });
  g.fillStyle = '#66707e'; g.font = '700 28px "Noto Sans TC", sans-serif'; g.fillText('你能撐到第幾波？ coomysf.github.io/maze-td', 540, 1250);
  return c.toDataURL('image/png');
}
$('b-save').addEventListener('click', () => {
  const a = document.createElement('a'); a.href = $('e-img').src; a.download = 'island-maze.png'; a.click();
});
$('b-copy').addEventListener('click', async () => {
  const win = S.wave >= LAST_WAVE && S.lives > 0;
  const text = win
    ? `我在《島嶼迷宮》30 波全部守住了，迷宮最長繞了 ${S.stats.maxLen} 格、剩 ${S.lives} 條命。換你：https://coomysf.github.io/maze-td/`
    : `我在《島嶼迷宮》撐到第 ${S.wave} 波，迷宮最長繞了 ${S.stats.maxLen} 格。你能撐多久？https://coomysf.github.io/maze-td/`;
  try { await navigator.clipboard.writeText(text); $('e-note').textContent = '已複製，貼到 Threads 吧'; }
  catch (e) { $('e-note').textContent = text; }
});
$('b-again').addEventListener('click', () => newGame(null));

/* ================= 按鈕 ================= */
$('b-go').addEventListener('click', startWave);
$('b-speed').addEventListener('click', () => { S.speed = S.speed === 3 ? 1 : S.speed + 1; syncUI(); });
$('b-pause').addEventListener('click', () => { if (S.phase === 'title' || S.phase === 'over') return; S.paused = true; $('m-pause').classList.add('on'); });
$('b-unpause').addEventListener('click', () => { S.paused = false; $('m-pause').classList.remove('on'); });
$('b-restart').addEventListener('click', () => { clearSave(); newGame(null); });
$('b-start').addEventListener('click', () => { clearSave(); newGame(null); });
const saved = loadSave();
if (saved && saved.wave > 0) {
  const b = $('b-resume'); b.hidden = false; b.textContent = `接著玩（第 ${saved.wave} 波守住了）`;
  b.addEventListener('click', () => newGame(saved));
  $('b-start').textContent = '重新開始';
}
document.addEventListener('visibilitychange', () => { if (document.hidden && (S.phase === 'wave')) { S.paused = true; $('m-pause').classList.add('on'); } });

/* ================= 主迴圈 ================= */
refreshPath(); fitCamera(); setSky(); syncUI();
const clock = new THREE.Clock();
let uiT = 0;
function frame() {
  const raw = Math.min(clock.getDelta(), .1), t = clock.elapsedTime;
  if (!S.paused && (S.phase === 'wave' || S.phase === 'build')) {
    const n = S.speed * 2;
    for (let i = 0; i < n && S.phase !== 'over'; i++) step(raw / 2);
    uiT += raw; if (uiT > .2) { uiT = 0; syncUI(); }
  }
  // 視覺：怪物、塔、地標
  for (const c of S.creeps) {
    c.mesh.position.copy(c.pos);
    if (!c.air) c.mesh.position.y = Math.abs(Math.sin(c.dist * 6)) * .06;
    else c.mesh.userData.wings?.forEach((w, i) => { w.rotation.z = Math.sin(t * 14) * .5 * (i ? -1 : 1); });
    const bar = c.mesh.userData.bar; bar.quaternion.copy(camera.quaternion).premultiply(c.mesh.quaternion.clone().invert());
    c.mesh.userData.fg.scale.x = Math.max(0, c.hp / c.maxHp);
  }
  for (const cell of S.grid) if (cell) {
    const m = cell.mesh;
    if (m.userData.grow != null && m.userData.grow < 1) { m.userData.grow = Math.min(1, m.userData.grow + raw * 5); const e = 1 - Math.pow(1 - m.userData.grow, 3); m.scale.setScalar((.2 + .8 * e) * (1 + cell.lvl * .06)); }
    if (m.userData.spin) m.userData.spin.rotation.y += raw * 1.5;
  }
  LANDMARKS.forEach((l, i) => { if (l.group.userData.blades) l.group.userData.blades.rotation.z += raw * 1.2; l.ring.material.opacity = .55 + Math.sin(t * 3 + i) * .3; });
  if (S.dock) S.dock.userData.boat.position.y = -.35 + Math.sin(t * 1.4) * .04;
  S.fx = S.fx.filter(e => { e.t += raw; const k = Math.min(1, e.t / e.life); e.update(e, k, raw); if (k >= 1) { scene.remove(e.obj); return false; } return true; });
  seaU.t.value = t;
  drawDots(t);
  renderer.render(scene, camera);
  for (const tg of tags) { const p = tg.pos.clone().project(camera); tg.el.style.left = `${(p.x + 1) / 2 * innerWidth}px`; tg.el.style.top = `${(1 - p.y) / 2 * innerHeight}px`; }
  requestAnimationFrame(frame);
}
frame();
window.__maze = { screenOf: (x, y) => { const v = cellPos(x, y).project(camera); return { x: (v.x + 1) / 2 * innerWidth, y: (1 - v.y) / 2 * innerHeight }; }, zoom: () => VIEW.zoom.toFixed(2), S, tryPlace, upgrade, startWave, TOWERS, KINDS, waveSpec, computeFields, tracePath, newGame, RESERVED, W, H, get PATH() { return PATH; } };
</script>
