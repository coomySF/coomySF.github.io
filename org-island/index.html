<style>
  :root {
    --ink: #222a36;
    --muted: #66707e;
    --paper: rgba(255, 252, 246, 0.9);
    --line: rgba(34, 42, 54, 0.1);
    --accent: #d9603b;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f6e6cf; color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #stage { position: fixed; inset: 0; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  .vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 60%, rgba(30,38,48,0.14) 100%); }

  .veil { position: fixed; left: 0; right: 0; top: 0; height: 210px; pointer-events: none;
    background: linear-gradient(to bottom, rgba(246,228,204,0.88) 0%, rgba(246,228,204,0.6) 50%, rgba(246,228,204,0) 100%); }
  .head { position: fixed; top: max(18px, env(safe-area-inset-top)); left: 18px; right: 18px; pointer-events: none; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--accent);
    background: rgba(255,252,246,0.85); padding: 3px 9px; border-radius: 999px; }
  .head h1 { margin: 8px 0 0; font-family: "Noto Serif TC", serif; font-weight: 900; letter-spacing: 0.02em;
    font-size: clamp(28px, 7.4vw, 50px); line-height: 1.18; color: #1c2430;
    text-shadow: 0 1px 0 rgba(255,255,255,0.7), 0 0 24px rgba(255,248,236,0.9);
    transition: font-size .6s var(--ease); }
  .head .sub { margin: 8px 0 0; font-size: clamp(14px, 3.6vw, 17px); font-weight: 700; color: #3a4350;
    text-shadow: 0 0 14px rgba(255,248,236,1), 0 0 4px rgba(255,248,236,1);
    transition: opacity .5s var(--ease), transform .5s var(--ease); }
  body.focus .head h1 { font-size: clamp(18px, 4.6vw, 26px); }
  body.focus .head .sub { opacity: 0; transform: translateY(-6px); }

  .caption { position: fixed; left: 14px; right: 14px; bottom: max(14px, env(safe-area-inset-bottom)); margin: 0 auto; max-width: 540px;
    background: var(--paper); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-radius: 16px; padding: 14px 16px 12px 20px; box-shadow: 0 12px 32px rgba(40,30,20,0.16);
    overflow: hidden; }
  .caption::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--bar, var(--accent));
    transition: background .4s var(--ease); }
  .caption .top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 24px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 8px; border-radius: 999px; background: #fff;
    border: 1px solid var(--line); font-size: 13px; font-weight: 700; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .caption .arrow { color: var(--muted); font-weight: 700; }
  .caption .count { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .caption .big { margin-top: 8px; font-size: clamp(17px, 4.6vw, 20px); font-weight: 900; line-height: 1.4; }
  .caption .small { margin-top: 4px; font-size: 13px; line-height: 1.55; color: var(--muted); }
  .caption .src { margin-top: 8px; font-size: 11px; color: #9aa1ab; }
  .caption .swap { animation: rise .5s var(--ease); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }

  .ctrl { position: fixed; right: 16px; top: max(18px, env(safe-area-inset-top)); pointer-events: auto; }
  .ctrl button { border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 7px 12px;
    font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }

  .isl { transform: translateY(-4px); white-space: nowrap; transition: opacity .4s var(--ease); }
  .isl span { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px 4px 9px; border-radius: 999px; background: rgba(255,252,246,0.95);
    font-weight: 900; font-size: 14px; color: var(--ink); box-shadow: 0 4px 14px rgba(40,30,20,0.18); }
  .isl span i { width: 9px; height: 9px; border-radius: 50%; }
  .isl.ext span { font-size: 12px; font-weight: 700; color: var(--muted); padding: 3px 9px 3px 8px; }
  .isl.dim { opacity: .3; }
  .brl { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 8px; background: rgba(255,252,246,0.96); white-space: nowrap;
    border-left: 4px solid; box-shadow: 0 3px 10px rgba(40,30,20,0.16); transition: opacity .4s var(--ease); }
  .brl.off { opacity: 0; }

  @media (max-width: 640px) {
    .ctrl { top: auto; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 168px); }
  }
  body.rec .ctrl { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .caption .swap { animation: none; }
    .head h1, .head .sub { transition: none; }
  }

  <h1>我把公司的組織 Spec<br>變成島嶼</h1>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

// ── 資料：取自 specformula-vibe benchmarks/domains/software/scenarios（projects、contracts）──
const UNITS = [
  { id: "course",    name: "課程平台", color: "#d9603b", angle: null, r: 0,  size: 6.4, houses: 4 },
  { id: "assistant", name: "助教",     color: "#7a63c9", angle: 90,  r: 18, size: 4.6, houses: 3 },
  { id: "crm",       name: "CRM",      color: "#2e9e7f", angle: 28,  r: 18, size: 4.2, houses: 3 },
  { id: "finance",   name: "財務",     color: "#c9962a", angle: 152, r: 18, size: 4.2, houses: 3 },
  { id: "hr",        name: "人資",     color: "#c4577f", angle: 118, r: 30, size: 4.0, houses: 2 },
  { id: "ecpay",      name: "綠界金流",       color: "#8a94a3", angle: 226, r: 19, size: 2.8, ext: "kiosk" },
  { id: "cloudfront", name: "AWS CloudFront", color: "#8a94a3", angle: 268, r: 17.5, size: 2.8, ext: "warehouse" },
  { id: "discord",    name: "Discord",        color: "#8a94a3", angle: 314, r: 19, size: 2.8, ext: "tower" },
];
// plain：給路人看的一句白話；body：約定原文摘句
const DEALS = [
  { id: "hr-assistant", from: "hr", to: "assistant", what: "聘僱狀態", plain: "人資告訴助教：誰還在職",
    body: "人資提供既有助教的聘僱狀態，助教服務以在職者為可承接對象。" },
  { id: "course-assistant", from: "course", to: "assistant", what: "學習進度", plain: "課程平台讓助教看到：學員學到哪",
    body: "學習進度及作業提交事實由課程平台維護，助教人工查看進度並挑選關懷對象。" },
  { id: "assistant-crm", from: "assistant", to: "crm", what: "關懷紀錄", plain: "助教把關懷紀錄寫進 CRM",
    body: "助教的關懷紀錄由使用者在 CRM 人工填寫聯繫時間及結果摘要。" },
  { id: "assistant-finance", from: "assistant", to: "finance", what: "計酬依據", plain: "助教交給財務：計酬依據",
    body: "助教服務向財務提供既有計酬依據；完成關懷任務不新增報酬。" },
  { id: "course-crm", from: "course", to: "crm", what: "學員與訂單資料", plain: "課程平台交給 CRM：學員、上課與訂單資料",
    body: "這些資料以課程平台為準；CRM 的聯繫紀錄不能改變學習與訂單事實。" },
  { id: "course-finance", from: "course", to: "finance", what: "電商資料", plain: "課程平台交給財務：每一筆電商資料",
    body: "課程平台向財務提供電商資料；關懷任務與聯繫紀錄不取代訂單及付款資料。" },
  { id: "course-ecpay", from: "course", to: "ecpay", what: "付款請求", plain: "課程平台向綠界送出付款請求",
    body: "送出請求不等於付款成功。" },
  { id: "ecpay-course", from: "ecpay", to: "course", what: "付款結果", plain: "綠界回報付款結果",
    body: "綠界金流呼叫課程平台的接收端點，回傳付款結果通知。" },
  { id: "course-discord", from: "course", to: "discord", what: "課程通知", plain: "課程平台透過 Discord 發課程通知",
    body: "課程平台透過組織使用的固定 Discord 對象發送課程通知。" },
  { id: "course-cloudfront", from: "course", to: "cloudfront", what: "教材分發", unknown: true,
    plain: "學員從 CloudFront 拿教材，但誰把資料交給誰，約定沒寫清楚",
    body: "這份約定的方向標示為「待確認」。" },
];
const unitById = Object.fromEntries(UNITS.map((u) => [u.id, u]));
const params = new URLSearchParams(location.search);
if (params.has("rec")) document.body.classList.add("rec");

// 固定亂數，畫面每次一樣
let seed = 20261024;
const rand = () => { seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const pick = (arr) => arr[Math.floor(rand() * arr.length)];

// ── 場景 ──
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: params.has("rec") });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
document.getElementById("stage").appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer({ element: document.getElementById("labels") });

const HORIZON = "#f4dcc0";
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(HORIZON, 80, 200);
const camera = new THREE.PerspectiveCamera(30, 1, 0.5, 600);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = 1.36;
controls.minDistance = 16;
controls.maxDistance = 260;

scene.add(new THREE.HemisphereLight("#cfe8f5", "#7a6a55", 0.62));
const sun = new THREE.DirectionalLight("#ffe2b8", 2.7);
sun.position.set(-46, 34, 26);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -46, right: 46, top: 46, bottom: -46, near: 1, far: 160 });
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.02;
scene.add(sun);

// 天空：地平線暖、頂部藍
const sky = new THREE.Mesh(new THREE.SphereGeometry(420, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: { top: { value: new THREE.Color("#7fb8e0") }, horizon: { value: new THREE.Color(HORIZON) } },
  vertexShader: "varying vec3 vP; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vP = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }",
  fragmentShader: "uniform vec3 top; uniform vec3 horizon; varying vec3 vP; void main(){ float h = clamp(normalize(vP).y * 2.4, 0.0, 1.0); gl_FragColor = vec4(mix(horizon, top, pow(h, 0.65)), 1.0); \n#include <colorspace_fragment>\n }",
}));
scene.add(sky);

const mat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.85, ...extra });
const M = {
  wall: ["#f6efe3", "#efe3cf", "#f3e8d8"].map((c) => mat(c, { roughness: 0.9 })),
  roof: ["#c0634a", "#a9533f", "#5f6e7d", "#8f6748"].map((c) => mat(c, { roughness: 0.7, flatShading: true })),
  trim: mat("#5a4a3c", { roughness: 0.8 }),
  glass: mat("#a9d6ec", { roughness: 0.15, metalness: 0.1, emissive: "#3c6e8a", emissiveIntensity: 0.15 }),
  skirt: mat("#6b5d4f", { roughness: 1 }),
  wood: mat("#9a6d48", { roughness: 0.9 }),
  stone: mat("#cfc6b6", { roughness: 1, flatShading: true }),
  leaf: ["#5f9e4f", "#4f8d48", "#79ad55"].map((c) => mat(c, { roughness: 0.9, flatShading: true })),
  pine: mat("#3f7a4a", { roughness: 0.9, flatShading: true }),
  trunk: mat("#7a5136"),
  lamp: mat("#ffe7b0", { emissive: "#ffcf7a", emissiveIntensity: 0.6 }),
  metal: mat("#5b636d", { roughness: 0.5, metalness: 0.4 }),
};
const shadowed = (m) => { m.castShadow = true; m.receiveShadow = true; return m; };

// 海
const seaGeo = new THREE.PlaneGeometry(700, 700, 140, 140);
seaGeo.rotateX(-Math.PI / 2);
const seaBase = seaGeo.attributes.position.array.slice();
const sea = new THREE.Mesh(seaGeo, mat("#3e9fc8", { roughness: 0.3, metalness: 0.05, flatShading: true }));
sea.receiveShadow = true;
scene.add(sea);
function waveSea(t) {
  const p = seaGeo.attributes.position.array;
  for (let i = 0; i < p.length; i += 3) {
    const x = seaBase[i], z = seaBase[i + 2];
    if (Math.abs(x) > 140 || Math.abs(z) > 140) continue;
    p[i + 1] = Math.sin(x * 0.16 + t * 0.8) * 0.16 + Math.cos(z * 0.19 + t * 0.6) * 0.16 - 0.4;
  }
  seaGeo.attributes.position.needsUpdate = true;
  seaGeo.computeVertexNormals();
}

// 遠山
for (let i = 0; i < 46; i++) {
  const a = (i / 46) * Math.PI * 2 + rand() * 0.1;
  const r = 150 + rand() * 40;
  const h = 10 + rand() * 22;
  const m = new THREE.Mesh(new THREE.ConeGeometry(14 + rand() * 12, h, 5), mat(pick(["#7f9a86", "#8aa590", "#6f8c7c"]), { flatShading: true }));
  m.position.set(Math.cos(a) * r, h / 2 - 1.5, Math.sin(a) * r);
  m.rotation.y = rand() * 3;
  scene.add(m);
}
// 雲
const clouds = [];
for (let i = 0; i < 7; i++) {
  const g = new THREE.Group();
  for (let k = 0; k < 4; k++) {
    const puff = new THREE.Mesh(new THREE.IcosahedronGeometry(1.6 + rand() * 1.4, 0), mat("#ffffff", { flatShading: true, roughness: 1 }));
    puff.position.set(k * 1.9 - 3, rand() * 0.8, rand() * 1.6);
    puff.castShadow = true;
    g.add(puff);
  }
  g.position.set(-70 + rand() * 140, 24 + rand() * 6, -60 + rand() * 90);
  clouds.push({ g, v: 0.6 + rand() * 0.5 });
  scene.add(g);
}

function posOf(u) {
  if (u.angle === null) return new THREE.Vector3(0, 0, 0);
  const a = THREE.MathUtils.degToRad(u.angle);
  return new THREE.Vector3(Math.cos(a) * u.r, 0, -Math.sin(a) * u.r);
}

// ── 建物 ──
function house(w, d, h) {
  const g = new THREE.Group();
  const skirt = shadowed(new THREE.Mesh(new THREE.BoxGeometry(w + 0.24, 0.1, d + 0.24), M.skirt));
  skirt.position.y = 0.05;
  const wall = shadowed(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), pick(M.wall)));
  wall.position.y = h / 2 + 0.1;
  // 斜屋頂（三角柱），兩側挑出屋簷
  const r = (d + 0.5) / Math.sqrt(3);
  const roofGeo = new THREE.CylinderGeometry(r, r, w + 0.4, 3);
  roofGeo.rotateZ(Math.PI / 2);
  roofGeo.rotateX(-Math.PI / 2);
  const roof = shadowed(new THREE.Mesh(roofGeo, pick(M.roof)));
  roof.position.y = h + 0.1 + r * 0.5;
  g.add(skirt, wall, roof);
  // 門與窗框
  const door = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.72, 0.06), M.trim);
  door.position.set(-w * 0.22, 0.46, d / 2 + 0.02);
  const step = shadowed(new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.08, 0.3), M.stone));
  step.position.set(-w * 0.22, 0.12, d / 2 + 0.16);
  g.add(door, step);
  const wins = Math.max(1, Math.round(w / 1.1));
  for (let i = 0; i < wins; i++) {
    const x = -w / 2 + (w / (wins + 1)) * (i + 1) + (i === 0 ? 0.2 : 0);
    if (Math.abs(x + w * 0.22) < 0.4 && h < 1.8) continue;
    const frame = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.46, 0.05), M.trim);
    frame.position.set(x, h * 0.62 + 0.1, d / 2 + 0.02);
    const pane = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.34, 0.05), M.glass);
    pane.position.set(x, h * 0.62 + 0.1, d / 2 + 0.04);
    g.add(frame, pane);
  }
  if (rand() > 0.5) {
    const chim = shadowed(new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.6, 0.28), M.stone));
    chim.position.set(w * 0.28, h + 0.1 + r * 0.6, -d * 0.15);
    g.add(chim);
  }
  return g;
}
function datahouse() {
  // 後端：石造機房，正面一排暖白指示燈
  const g = new THREE.Group();
  const base = shadowed(new THREE.Mesh(new THREE.BoxGeometry(2.0, 1.7, 1.6), M.stone));
  base.position.y = 0.95;
  const cap = shadowed(new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.16, 1.8), M.metal));
  cap.position.y = 1.88;
  g.add(base, cap);
  for (let i = 0; i < 3; i++) {
    const led = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.07, 0.04), M.lamp);
    led.position.set(0, 0.55 + i * 0.4, 0.82);
    g.add(led);
  }
  const fan = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.2, 10), M.metal));
  fan.position.set(0.5, 2.05, 0);
  g.add(fan);
  return g;
}
function tree(kind) {
  const g = new THREE.Group();
  const trunk = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.12, 0.6, 6), M.trunk));
  trunk.position.y = 0.3;
  g.add(trunk);
  if (kind === "pine") {
    for (let k = 0; k < 2; k++) {
      const c = shadowed(new THREE.Mesh(new THREE.ConeGeometry(0.62 - k * 0.16, 0.9, 7), M.pine));
      c.position.y = 0.8 + k * 0.5;
      g.add(c);
    }
  } else {
    const c = shadowed(new THREE.Mesh(new THREE.IcosahedronGeometry(0.55 + rand() * 0.2, 0), pick(M.leaf)));
    c.position.y = 1.0;
    g.add(c);
  }
  g.scale.setScalar(0.85 + rand() * 0.45);
  g.rotation.y = rand() * 6;
  return g;
}
function lamp() {
  const g = new THREE.Group();
  const pole = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 1.3, 6), M.metal));
  pole.position.y = 0.65;
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.11, 8, 6), M.lamp);
  bulb.position.y = 1.34;
  g.add(pole, bulb);
  return g;
}
function dock(len) {
  const g = new THREE.Group();
  for (let i = 0; i < len; i++) {

function flag(color) {

// ── 島 ──
const islands = {};
const foams = [];
const flags = [];
function bridgeDirs(u) {
  // 這座島上橋頭的方向，建物與碼頭避開
  return DEALS.filter((d) => d.from === u.id || d.to === u.id).map((d) => {
    const other = unitById[d.from === u.id ? d.to : d.from];
    const v = posOf(other).sub(posOf(u));
    return Math.atan2(v.z, v.x);
  });
}
function freeAngle(a, dirs, gap) { return dirs.every((b) => Math.abs(Math.atan2(Math.sin(a - b), Math.cos(a - b))) > gap); }

function makeIsland(u) {
  const g = new THREE.Group();
  g.position.copy(posOf(u));
  const s = u.size;
  // 淺灘與浪花
  const shallow = new THREE.Mesh(new THREE.CircleGeometry(s * 1.75, 40), mat("#86dccf", { transparent: true, opacity: 0.6, roughness: 0.3 }));
  shallow.rotation.x = -Math.PI / 2;
  shallow.position.y = -0.3;
  const foam = new THREE.Mesh(new THREE.RingGeometry(s * 1.2, s * 1.32, 48), new THREE.MeshBasicMaterial({ color: "#ffffff", transparent: true, opacity: 0.7 }));
  foam.rotation.x = -Math.PI / 2;
  foam.position.y = -0.18;
  foams.push(foam);
  const sand = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(s * 1.1, s * 1.24, 1.1, 20), mat("#e8d1a0", { roughness: 1 })));
  sand.position.y = -0.25;
  // 草地：頂點色雜訊
  const topGeo = new THREE.CylinderGeometry(s, s * 1.05, 0.5, 20, 1);
  const cols = [];
  const c1 = new THREE.Color(u.ext ? "#cfc6b6" : "#9cc27a"), c2 = new THREE.Color(u.ext ? "#bdb3a1" : "#86b066");
  for (let i = 0; i < topGeo.attributes.position.count; i++) { const c = c1.clone().lerp(c2, rand()); cols.push(c.r, c.g, c.b); }
  topGeo.setAttribute("color", new THREE.Float32BufferAttribute(cols, 3));
  const top = shadowed(new THREE.Mesh(topGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, flatShading: !!u.ext })));
  top.position.y = 0.5;
  g.add(shallow, foam, sand, top);

  const dirs = bridgeDirs(u);
  const onTop = (obj, ang, rad) => { obj.position.set(Math.cos(ang) * rad, 0.75, Math.sin(ang) * rad); g.add(obj); return obj; };
  if (u.ext) {
    addExternal(g, u);
  } else {
    // 建物：一棟機房＋數棟房子，沿內圈排開並避開橋頭
    const slots = [];
    for (let i = 0; i < 12; i++) { const a = (i / 12) * Math.PI * 2 + 0.2; if (freeAngle(a, dirs, 0.42)) slots.push(a); }
    const n = Math.min(u.houses + 1, slots.length);
    for (let i = 0; i < n; i++) {
      const a = slots[Math.floor((i * slots.length) / n)];
      const b = i === 0 ? datahouse() : house(1.5 + rand() * 0.9, 1.3 + rand() * 0.5, 1.2 + rand() * 0.8);
      const rad = s * (u.id === "course" ? 0.5 : 0.42);
      onTop(b, a, rad);
      b.rotation.y = -a - Math.PI / 2; // 正面朝島心
    }
    if (u.id === "course") {
      // 中心鐘塔：多數約定的源頭
      const tower = new THREE.Group();
      const body = shadowed(new THREE.Mesh(new THREE.BoxGeometry(1.2, 4.2, 1.2), M.wall[0]));
      body.position.y = 2.1;
      const clock = new THREE.Mesh(new THREE.CircleGeometry(0.36, 20), mat("#fffaf0", { emissive: "#ffe2a8", emissiveIntensity: 0.3 }));
      clock.position.set(0, 3.5, 0.61);
      const roof = shadowed(new THREE.Mesh(new THREE.ConeGeometry(1.05, 1.5, 4), M.roof[0]));
      roof.position.y = 4.95;
      roof.rotation.y = Math.PI / 4;
      tower.add(body, clock, roof);
      tower.position.set(0, 0.75, 0);
      g.add(tower);
    } else {
      const f = flag(u.color);
      f.position.set(0, 0.75, 0);
      g.add(f);
      flags.push(f);
    }
    // 樹、路燈、碼頭
    for (let i = 0; i < 9; i++) {
      const a = rand() * Math.PI * 2;
      if (!freeAngle(a, dirs, 0.3)) continue;
      onTop(tree(rand() > 0.6 ? "pine" : "round"), a, s * (0.78 + rand() * 0.12));
    }
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * Math.PI * 2 + 0.9;
      if (freeAngle(a, dirs, 0.3)) onTop(lamp(), a, s * 0.68);
    }
    const da = [0, 1, 2, 3, 4, 5].map((k) => k * 1.05 + 0.5).find((a) => freeAngle(a, dirs, 0.6));
    if (da !== undefined) {
      const dk = dock(6);
      dk.position.set(Math.cos(da) * s * 0.98, 0.32, Math.sin(da) * s * 0.98);
      dk.rotation.y = Math.PI / 2 - da;
      g.add(dk);
    }
  }
  scene.add(g);

  const el = document.createElement("div");
  el.className = "isl" + (u.ext ? " ext" : "");
  el.innerHTML = `<span><i style="background:${u.color}"></i>${u.name}</span>`;
  const label = new CSS2DObject(el);
  label.position.set(0, u.ext ? 4.2 : u.id === "course" ? 7.2 : 4.8, 0);
  g.add(label);
  islands[u.id] = { group: g, unit: u, el };
}

function addExternal(g, u) {
  const c = new THREE.Group();

    bubble.position.y = 3.35;
    const tail = shadowed(new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.5, 6), mat("#5865f2")));
    tail.rotation.z = Math.PI * 0.82;
    tail.position.set(-0.55, 2.8, 0);
    const hut = shadowed(new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.7, 0.9), M.wall[2]));
    hut.position.set(0.75, 0.35, 0.35);
    c.add(mast, bubble, tail, hut);
    for (let i = -1; i <= 1; i++) {

UNITS.forEach(makeIsland);

// ── 橋：每份約定一座；方向未定的是斷續的虛線橋 ──
const bridges = [];
DEALS.forEach((d) => {
  const a = unitById[d.from], b = unitById[d.to];
  const pa = posOf(a), pb = posOf(b);
  const dir = pb.clone().sub(pa).setY(0).normalize();
  const side = new THREE.Vector3(-dir.z, 0, dir.x);
  const pair = DEALS.some((o) => o.from === d.to && o.to === d.from);
  const off = pair ? 1.25 : 0;
  const start = pa.clone().addScaledVector(dir, a.size * 0.95).addScaledVector(side, off).setY(0.78);
  const end = pb.clone().addScaledVector(dir, -b.size * 0.95).addScaledVector(side, off).setY(0.78);
  const mid = start.clone().lerp(end, 0.5).addScaledVector(side, off * 0.8);
  mid.y = 1.7;
  const curve = new THREE.QuadraticBezierCurve3(start, mid, end);
  const len = curve.getLength();
  const color = new THREE.Color(a.ext ? b.color : a.color);

  const group = new THREE.Group();
  const deckMat = mat("#b98a5e", { transparent: true, roughness: 0.9 });
  const railMat = mat("#7a5a3e", { transparent: true, emissive: color, emissiveIntensity: 0 });
  const planks = Math.max(10, Math.round(len / 0.5));
  for (let k = 0; k <= planks; k++) {
    if (d.unknown && k % 3 !== 0) continue;
    const t = k / planks;
    const p = curve.getPointAt(t);
    const plank = shadowed(new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.12, 0.4), deckMat));
    plank.position.copy(p);
    plank.lookAt(p.clone().add(curve.getTangentAt(t)));
    group.add(plank);
  }
  if (!d.unknown) {
    for (const s of [-0.88, 0.88]) {
      const pts = curve.getSpacedPoints(40).map((p, k, arr) => {
        const tan = curve.getTangentAt(k / (arr.length - 1));
        return p.clone().addScaledVector(new THREE.Vector3(-tan.z, 0, tan.x).normalize(), s).setY(p.y + 0.42);
      });
      group.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 40, 0.05, 5), railMat));
      for (let k = 0; k <= 8; k++) {
        const p = pts[Math.round((k / 8) * (pts.length - 1))];
        const post = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.45, 5), railMat));
        post.position.copy(p).setY(p.y - 0.21);
        group.add(post);
      }
    }
  }
  scene.add(group);

  const el = document.createElement("div");
  el.className = "brl off";
  el.style.borderLeftColor = color.getStyle();
  el.textContent = d.unknown ? `${d.what}・方向待確認` : d.what;
  const label = new CSS2DObject(el);
  label.position.copy(curve.getPointAt(0.5)).add(new THREE.Vector3(0, 1.6, 0));
  scene.add(label);
  bridges.push({ deal: d, curve, len, group, deckMat, railMat, el, color, glow: 0, glowTo: 0, delay: 0 });
});
const bridgeById = Object.fromEntries(bridges.map((b) => [b.deal.id, b]));

const SHIRTS = ["#e76f51", "#2a9d8f", "#e9c46a", "#264653", "#f4a261", "#8ab17d", "#6d597a", "#457b9d"];
const SKIN = ["#f5d0b0", "#e8b896", "#c99470", "#f1c9a5"];
const HAIR = ["#2b2321", "#4a3426", "#6b4a2f", "#1f1f24"];
const PERSON_SCALE = 1.45;
function makePerson(boxColor) {
  const g = new THREE.Group();
  const body = shadowed(new THREE.Mesh(new THREE.CapsuleGeometry(0.2, 0.36, 4, 8), mat(pick(SHIRTS))));
  body.position.y = 0.72;
  const head = shadowed(new THREE.Mesh(new THREE.SphereGeometry(0.19, 12, 10), mat(pick(SKIN))));

const walkers = [];
bridges.forEach((br) => {

const idlers = [];
UNITS.forEach((u) => {

    idlers.push({ ...p, center: posOf(u), rad: u.size * (0.62 + rand() * 0.12), a: rand() * 6.28,
      speed: (0.22 + rand() * 0.18) * (k % 2 ? -1 : 1), phase: rand() * 6 });

});

// ── 導覽 ──
const caption = document.getElementById("caption");
const SOURCE = "資料取自 SpecFormula 範例組織（課程關懷）";
const touchCourse = DEALS.filter((d) => d.from === "course" || d.to === "course");
const QUICK = ["hr-assistant", "course-assistant", "assistant-crm", "assistant-finance", "course-crm", "course-discord"];
const STEPS = [
  { kind: "overview", sec: 5.5 },
  { kind: "ripple", sec: 6.5 },
  { kind: "deal", ids: ["course-finance"], sec: 6 },
  { kind: "deal", ids: ["course-ecpay", "ecpay-course"], sec: 6.5 },
  { kind: "deal", ids: ["course-cloudfront"], sec: 6.5 },
  { kind: "quick", ids: QUICK, sec: QUICK.length * 1.7 },
  { kind: "closing", sec: 6.5 },
];
let stepIndex = 0, stepTime = 0, subIndex = -1, touring = true, firstPass = true;
const camGoal = { pos: new THREE.Vector3(), target: new THREE.Vector3() };
const portrait = () => innerHeight > innerWidth;

function fitDistance(halfW, halfH) {
  const v = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  return Math.max(halfW / (v * camera.aspect), halfH / v);
}
function placeCamera(target, dist, pitchDeg) {
  const a = THREE.MathUtils.degToRad(pitchDeg);
  camGoal.target.copy(target);
  camGoal.pos.copy(target).add(new THREE.Vector3(0, Math.sin(a) * dist, Math.cos(a) * dist));
}
function overviewView() {
  if (portrait()) placeCamera(new THREE.Vector3(0, 0, -12), fitDistance(17, 20), 33);
  else placeCamera(new THREE.Vector3(0, 0, -6), fitDistance(36, 21), 33);
}
function focusOn(list) {
  const box = new THREE.Box3();
  list.forEach((b) => { box.expandByPoint(b.curve.v0); box.expandByPoint(b.curve.v2); });
  const units = new Set(list.flatMap((b) => [b.deal.from, b.deal.to]));
  const pad = Math.max(...[...units].map((id) => unitById[id].size)) + 1.5;
  const c = box.getCenter(new THREE.Vector3()).setY(0);
  const size = box.getSize(new THREE.Vector3());
  const halfW = Math.max(size.x / 2 + pad, 9);
  const halfD = Math.max(size.z / 2 + pad, 9);
  const p = portrait();
  placeCamera(c.add(new THREE.Vector3(0, 0, p ? 2.5 : 1)), fitDistance(halfW, halfD * 0.62) * (p ? 1.05 : 1.0), p ? 44 : 36);
}

const chip = (u) => `<span class="chip"><i style="background:${u.color}"></i>${u.name}</span>`;
function route(d) { return `${chip(unitById[d.from])}<span class="arrow">${d.unknown ? "↔" : "→"}</span>${chip(unitById[d.to])}`; }
function setCaption(bar, top, big, small, withCount = true) {
  caption.style.setProperty("--bar", bar);
  const count = withCount ? `<span class="count">${stepIndex + 1} / ${STEPS.length}</span>` : "";
  caption.innerHTML = `<div class="swap"><div class="top">${top}${count}</div><div class="big">${big}</div>${small ? `<div class="small">${small}</div>` : ""}<div class="src">${SOURCE}</div></div>`;
}

function highlight(activeIds, units, stagger = 0) {
  const set = activeIds ? new Set(activeIds) : null;
  let order = 0;
  bridges.forEach((b) => {
    const on = !set || set.has(b.deal.id);
    b.deckMat.opacity = on ? 1 : 0.3;
    b.railMat.opacity = on ? 1 : 0.3;
    b.glowTo = set && on ? 1 : 0;
    b.delay = set && on ? (order++) * stagger : 0;
    b.el.classList.toggle("off", !(set && on));
  });
  Object.values(islands).forEach(({ unit, el }) => {
    el.classList.toggle("dim", !!units && !units.includes(unit.id));
  });
}

function applyStep() {
  const s = STEPS[stepIndex];
  document.body.classList.toggle("focus", s.kind !== "overview" && s.kind !== "closing");
  if (s.kind === "overview") {
    overviewView();
    highlight(null, null);
    setCaption("#d9603b", `<span class="chip">一張組織的 spec 地圖</span>`,
      "每座島是一個單位，每座橋是一份約定", "小人搬的箱子，就是約定裡寫好要交出去的資料。");
  } else if (s.kind === "ripple") {
    if (portrait()) placeCamera(new THREE.Vector3(0, 0, -5), fitDistance(17, 18), 38); else placeCamera(new THREE.Vector3(0, 0, -5), fitDistance(32, 19), 34);
    highlight(touchCourse.map((d) => d.id), [...new Set(touchCourse.flatMap((d) => [d.from, d.to]))], 0.22);
    setCaption("#d9603b", chip(unitById.course),
      `10 份約定裡，有 ${touchCourse.length} 份連到課程平台`, `課程平台的 spec 一改，這 ${touchCourse.length} 條都要重新對過。`);
  } else if (s.kind === "deal") {
    const list = s.ids.map((id) => bridgeById[id]);
    focusOn(list);
    highlight(s.ids, [...new Set(list.flatMap((b) => [b.deal.from, b.deal.to]))]);
    const d = list[0].deal;
    if (list.length === 2) {
      setCaption(list[0].color.getStyle(), `${chip(unitById[d.from])}<span class="arrow">⇄</span>${chip(unitById[d.to])}`,
        "課程平台送出付款請求，綠界回報付款結果", "兩個方向是兩份約定；送出請求不等於付款成功。");
    } else {
      setCaption(d.unknown ? "#8a94a3" : list[0].color.getStyle(), route(d), d.plain, d.body);
    }
  } else if (s.kind === "quick") {
    subIndex = -1;
    overviewView();
    showQuick(0);
  } else {
    overviewView();
    highlight(DEALS.map((d) => d.id), null, 0.08);
    setCaption("#d9603b", `<span class="chip">#組織 AI-native co-work</span>`,
      "每一座橋，都是一份要有人管的 spec", "點橋可以看每一份約定。");
  }
}
function showQuick(i) {
  if (i === subIndex) return;
  subIndex = i;
  const s = STEPS[stepIndex];
  const b = bridgeById[s.ids[i]];
  highlight([b.deal.id], [b.deal.from, b.deal.to]);
  setCaption(b.color.getStyle(), route(b.deal) + `<span class="count">其他約定 ${i + 1} / ${s.ids.length}</span>`, b.deal.plain, "", false);
}

const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener("pointerdown", (e) => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener("pointerup", (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(bridges.map((b) => b.group), true)[0];
  const br = hit && bridges.find((b) => b.group === hit.object.parent);
  if (!br) return;
  stopTour();
  document.body.classList.add("focus");
  focusOn([br]);
  highlight([br.deal.id], [br.deal.from, br.deal.to]);
  setCaption(br.color.getStyle(), route(br.deal), br.deal.plain, br.deal.body, false);
});
// 手動點橋後鏡頭也要移過去
function followGoal(dt, rate) {
  const k = 1 - Math.exp(-dt * rate);
  camera.position.lerp(camGoal.pos, k);
  controls.target.lerp(camGoal.target, k);
}
let manualFocus = 0;
renderer.domElement.addEventListener("pointerup", () => { if (!touring) manualFocus = 2.5; });

// ── 迴圈 ──
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  if (touring) applyStep();
}
addEventListener("resize", resize);
resize();
// 開場：從課程平台與財務之間的小人近景拉遠到全貌
{
  const m = bridgeById["course-finance"].curve.getPointAt(0.45);
  controls.target.copy(m);
  camera.position.copy(m).add(new THREE.Vector3(2.5, 3.2, 6.5));
}

const clock = new THREE.Clock();
let elapsed = 0;
function tick(dt) {
  elapsed += dt;
  waveSea(elapsed);

  if (touring) {
    stepTime += dt;
    const s = STEPS[stepIndex];
    if (s.kind === "quick") showQuick(Math.min(s.ids.length - 1, Math.floor(stepTime / (s.sec / s.ids.length))));
    if (stepTime > s.sec) { stepTime = 0; stepIndex = (stepIndex + 1) % STEPS.length; if (stepIndex === 0) firstPass = false; applyStep(); }
    followGoal(dt, firstPass && stepIndex === 0 ? 0.9 : 1.5);
  } else if (manualFocus > 0) {
    manualFocus -= dt;
    followGoal(dt, 2);
  }

  for (const b of bridges) {
    if (b.delay > 0) { b.delay -= dt; continue; }
    b.glow += (b.glowTo - b.glow) * (1 - Math.exp(-dt * 6));
    b.railMat.emissiveIntensity = b.glow * 0.9;
  }
  for (const w of walkers) {
    w.t += (w.dir * w.speed * dt) / w.br.len;
    if (w.t >= 1) { w.t = 1; w.dir = -1; }
    if (w.t <= 0) { w.t = 0; w.dir = 1; }
    w.box.visible = w.dir === 1; // 去程搬箱子，回程空手
    const t = THREE.MathUtils.clamp(w.t, 0.001, 0.999);
    const p = w.br.curve.getPointAt(t);
    const tan = w.br.curve.getTangentAt(t).multiplyScalar(w.dir);
    const sd = new THREE.Vector3(-tan.z, 0, tan.x).normalize();
    const step = elapsed * 9 + w.phase;
    w.g.position.copy(p).addScaledVector(sd, 0.42).setY(p.y + 0.06 + Math.abs(Math.sin(step)) * 0.08);
    w.g.rotation.y = Math.atan2(tan.x, tan.z);
    w.legs[0].rotation.x = Math.sin(step) * 0.6;
    w.legs[1].rotation.x = -Math.sin(step) * 0.6;
  }
  for (const w of idlers) {
    w.a += (w.speed * dt) / (w.rad * 0.25);
    const step = elapsed * 7 + w.phase;
    w.g.position.set(w.center.x + Math.cos(w.a) * w.rad, 0.75 + Math.abs(Math.sin(step)) * 0.06, w.center.z + Math.sin(w.a) * w.rad);
    const s = Math.sign(w.speed);
    w.g.rotation.y = Math.atan2(-Math.sin(w.a) * s, Math.cos(w.a) * s);
    w.legs[0].rotation.x = Math.sin(step) * 0.5;
    w.legs[1].rotation.x = -Math.sin(step) * 0.5;
  }
  for (const f of foams) { const k = 1 + Math.sin(elapsed * 1.2) * 0.025; f.scale.set(k, k, 1); f.material.opacity = 0.55 + Math.sin(elapsed * 1.2) * 0.15; }
  for (const f of flags) f.userData.cloth.rotation.y = Math.sin(elapsed * 2.4 + f.position.x) * 0.25;
  for (const c of clouds) { c.g.position.x += c.v * dt; if (c.g.position.x > 90) c.g.position.x = -90; }

  controls.update();
  const camDist = camera.position.distanceTo(controls.target);
  scene.fog.near = camDist * 1.2;
  scene.fog.far = camDist * 3.4 + 60;
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
if (params.has("rec")) window.__frame = (dt) => tick(dt);
else renderer.setAnimationLoop(() => tick(Math.min(clock.getDelta(), 0.05)));
</script>
