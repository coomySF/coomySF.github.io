  const ARP = [0, 1, 2, 1, 3, 2, 1, 2]; // 3＝高八度的根音
  function init() {
    if (ctx) { if (ctx.state === "suspended") ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    const comp = ctx.createDynamicsCompressor();
    master = ctx.createGain();
    master.gain.value = muted ? 0 : 0.55;
    master.connect(comp).connect(ctx.destination);
    musicGain = ctx.createGain();
    musicGain.gain.value = 0.55;
    musicGain.connect(master);
    nextTime = ctx.currentTime + 0.1;
    timer = setInterval(schedule, 50);
  }
  function tone(freq, t, dur, { type = "sine", gain = 0.2, attack = 0.005, out = musicGain, detune = 0 } = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq; o.detune.value = detune;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(out);
    o.start(t); o.stop(t + dur + 0.05);
    return o;
  }
  function pluck(freq, t, gain = 0.16, out = musicGain) {
    // 拇指琴：基音＋短促的高泛音
    tone(freq, t, 0.9, { gain, out });
    tone(freq * 3, t, 0.18, { gain: gain * 0.25, out });
    tone(freq, t, 0.6, { type: "triangle", gain: gain * 0.35, out, detune: 6 });
  }
  let noiseBuf = null;
  function noise(t, dur, { gain = 0.05, freq = 6000, q = 1, type = "highpass", out = musicGain, sweepTo = null } = {}) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q;
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(out);
    src.start(t); src.stop(t + dur + 0.05);
  }
  function schedule() {
    while (nextTime < ctx.currentTime + 0.25) {
      const bar = Math.floor(step / 8) % 4, i = step % 8;
      const chord = CHORDS[bar];
      const n = ARP[i] === 3 ? chord[0] + 12 : chord[ARP[i]];
      if (!(i === 7 && bar % 2 === 1)) pluck(N(n + 12), nextTime, i === 0 ? 0.15 : 0.1);
      if (i === 0 || i === 4) tone(N(chord[0] - 12), nextTime, EIGHTH * 3.5, { gain: 0.16 });
      if (i === 0) chord.forEach((m) => tone(N(m), nextTime, EIGHTH * 8, { type: "triangle", gain: 0.025, attack: 0.4 }));
      if (i % 2 === 1) noise(nextTime, 0.06, { gain: 0.025 });
      nextTime += EIGHTH; step++;
    }
  }
  const now = () => ctx.currentTime + 0.01;
  const fx = (fn) => { if (ctx && !muted) fn(now()); };
  return {
    start: init,
    get muted() { return muted; },
    toggle() {
      init();
      muted = !muted;
      try { localStorage.setItem("org-island-muted", muted ? "1" : "0"); } catch {}
      if (master) master.gain.setTargetAtTime(muted ? 0 : 0.55, ctx.currentTime, 0.05);
      return muted;
    },
    whoosh: () => fx((t) => noise(t, 0.5, { gain: 0.12, type: "bandpass", freq: 600, q: 2, sweepTo: 3200, out: master })),
    ok: () => fx((t) => { tone(N(88), t, 0.35, { gain: 0.09, out: master }); tone(N(95), t + 0.06, 0.3, { gain: 0.05, out: master }); }),
    bad: () => fx((t) => { tone(N(57), t, 0.18, { type: "triangle", gain: 0.16, out: master }); tone(N(56), t + 0.16, 0.25, { type: "triangle", gain: 0.16, out: master }); }),
    pop: () => fx((t) => { const o = tone(N(72), t, 0.18, { gain: 0.14, out: master }); o.frequency.exponentialRampToValueAtTime(N(84), t + 0.1); }),
    answer: () => fx((t) => [72, 76, 79].forEach((m, k) => pluck(N(m), t + k * 0.07, 0.12, master))),
    sparkle: () => fx((t) => [72, 76, 79, 84, 88].forEach((m, k) => pluck(N(m), t + k * 0.08, 0.1, master))),
  };
})();

function house(w, d, h) {
  const g = new THREE.Group();
  const skirt = shadowed(new THREE.Mesh(new THREE.BoxGeometry(w + 0.24, 0.1, d + 0.24), M.skirt));
  skirt.position.y = 0.05;
  const wall = shadowed(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), pick(M.wall)));
  wall.position.y = h / 2 + 0.1;
  // 斜屋頂（三角柱），兩側挑出屋簷
  const r = (d + 0.5) / Math.sqrt(3);
  const roofGeo = new THREE.CylinderGeometry(r, r, w + 0.4, 3);
  roofGeo.rotateZ(Math.PI / 2);
  roofGeo.rotateX(-Math.PI / 2);
  const roof = shadowed(new THREE.Mesh(roofGeo, pick(M.roof)));
  roof.position.y = h + 0.1 + r * 0.5;
  g.add(skirt, wall, roof);
  // 門與窗框
  const door = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.72, 0.06), M.trim);
  door.position.set(-w * 0.22, 0.46, d / 2 + 0.02);
  const step = shadowed(new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.08, 0.3), M.stone));
  step.position.set(-w * 0.22, 0.12, d / 2 + 0.16);
  g.add(door, step);
  const wins = Math.max(1, Math.round(w / 1.1));
  for (let i = 0; i < wins; i++) {
    const x = -w / 2 + (w / (wins + 1)) * (i + 1) + (i === 0 ? 0.2 : 0);
    if (Math.abs(x + w * 0.22) < 0.4 && h < 1.8) continue;
    const frame = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.46, 0.05), M.trim);
    frame.position.set(x, h * 0.62 + 0.1, d / 2 + 0.02);
    const pane = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.34, 0.05), M.glass);
    pane.position.set(x, h * 0.62 + 0.1, d / 2 + 0.04);
    g.add(frame, pane);
  }
  if (rand() > 0.5) {
    const chim = shadowed(new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.6, 0.28), M.stone));
    chim.position.set(w * 0.28, h + 0.1 + r * 0.6, -d * 0.15);
    g.add(chim);
  }
  return g;
}

// ── 島 ──
const islands = {};
const foams = [];
const flags = [];
function bridgeDirs(u) {
  // 這座島上橋頭的方向，建物與碼頭避開
  return DEALS.filter((d) => d.from === u.id || d.to === u.id).map((d) => {
    const other = unitById[d.from === u.id ? d.to : d.from];
    const v = posOf(other).sub(posOf(u));
    return Math.atan2(v.z, v.x);
  });
}
function freeAngle(a, dirs, gap) { return dirs.every((b) => Math.abs(Math.atan2(Math.sin(a - b), Math.cos(a - b))) > gap); }

function makeIsland(u) {
  const g = new THREE.Group();
  g.position.copy(posOf(u));
  const s = u.size;
  // 淺灘與浪花
  const shallow = new THREE.Mesh(new THREE.CircleGeometry(s * 1.75, 40), mat("#86dccf", { transparent: true, opacity: 0.6, roughness: 0.3 }));
  shallow.rotation.x = -Math.PI / 2;
  shallow.position.y = -0.3;
  const foam = new THREE.Mesh(new THREE.RingGeometry(s * 1.2, s * 1.32, 48), new THREE.MeshBasicMaterial({ color: "#ffffff", transparent: true, opacity: 0.7 }));
  foam.rotation.x = -Math.PI / 2;
  foam.position.y = -0.18;
  foams.push(foam);
  const sand = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(s * 1.1, s * 1.24, 1.1, 20), mat("#e8d1a0", { roughness: 1 })));
  sand.position.y = -0.25;
  // 草地：頂點色雜訊
  const topGeo = new THREE.CylinderGeometry(s, s * 1.05, 0.5, 20, 1);
  const cols = [];
  const c1 = new THREE.Color(u.ext ? "#cfc6b6" : "#9cc27a"), c2 = new THREE.Color(u.ext ? "#bdb3a1" : "#86b066");
  for (let i = 0; i < topGeo.attributes.position.count; i++) { const c = c1.clone().lerp(c2, rand()); cols.push(c.r, c.g, c.b); }
  topGeo.setAttribute("color", new THREE.Float32BufferAttribute(cols, 3));
  const top = shadowed(new THREE.Mesh(topGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, flatShading: !!u.ext })));
  top.position.y = 0.5;
  g.add(shallow, foam, sand, top);

  const dirs = bridgeDirs(u);
  const onTop = (obj, ang, rad) => { obj.position.set(Math.cos(ang) * rad, 0.75, Math.sin(ang) * rad); g.add(obj); return obj; };
  if (u.ext) {
    addExternal(g, u);
  } else {
    // 建物：一棟機房＋數棟房子，沿內圈排開並避開橋頭
    const slots = [];
    for (let i = 0; i < 12; i++) { const a = (i / 12) * Math.PI * 2 + 0.2; if (freeAngle(a, dirs, 0.42)) slots.push(a); }
    const n = Math.min(u.houses + 1, slots.length);
    for (let i = 0; i < n; i++) {
      const a = slots[Math.floor((i * slots.length) / n)];
      const b = i === 0 ? datahouse() : house(1.5 + rand() * 0.9, 1.3 + rand() * 0.5, 1.2 + rand() * 0.8);
      const rad = s * (u.id === "course" ? 0.5 : 0.42);
      onTop(b, a, rad);
      b.rotation.y = -a - Math.PI / 2; // 正面朝島心
    }
    if (u.id === "course") {
      // 中心鐘塔：多數約定的源頭
      const tower = new THREE.Group();
      const body = shadowed(new THREE.Mesh(new THREE.BoxGeometry(1.2, 4.2, 1.2), M.wall[0]));
      body.position.y = 2.1;
      const clock = new THREE.Mesh(new THREE.CircleGeometry(0.36, 20), mat("#fffaf0", { emissive: "#ffe2a8", emissiveIntensity: 0.3 }));
      clock.position.set(0, 3.5, 0.61);
      const roof = shadowed(new THREE.Mesh(new THREE.ConeGeometry(1.05, 1.5, 4), M.roof[0]));
      roof.position.y = 4.95;
      roof.rotation.y = Math.PI / 4;
      tower.add(body, clock, roof);
      tower.position.set(0, 0.75, -2.6); // 鐘塔退到後方，島心留給 AllWill 字樣、水球與 Coomy
      g.add(tower);
    } else {
      const f = flag(u.color);
      f.position.set(0, 0.75, 0);
      g.add(f);
      flags.push(f);
    }
    // 樹、路燈、碼頭
    for (let i = 0; i < 9; i++) {
      const a = rand() * Math.PI * 2;
      if (!freeAngle(a, dirs, 0.3)) continue;
      onTop(tree(rand() > 0.6 ? "pine" : "round"), a, s * (0.78 + rand() * 0.12));
    }
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * Math.PI * 2 + 0.9;
      if (freeAngle(a, dirs, 0.3)) onTop(lamp(), a, s * 0.68);
    }
    const da = [0, 1, 2, 3, 4, 5].map((k) => k * 1.05 + 0.5).find((a) => freeAngle(a, dirs, 0.6));
    if (da !== undefined) {
      const dk = dock(6);
      dk.position.set(Math.cos(da) * s * 0.98, 0.32, Math.sin(da) * s * 0.98);
      dk.rotation.y = Math.PI / 2 - da;
      g.add(dk);
    }
  }
  scene.add(g);

  const el = document.createElement("div");
  el.className = "isl" + (u.ext ? " ext" : "");
  el.innerHTML = `<span><i style="background:${u.color}"></i>${u.name}</span>`;
  const label = new CSS2DObject(el);
  label.position.set(0, u.ext ? 4.2 : u.id === "course" ? 7.2 : 4.8, 0);
  g.add(label);
  islands[u.id] = { group: g, unit: u, el };
}

function addExternal(g, u) {
  const c = new THREE.Group();
  if (u.ext === "kiosk") {
    // 綠界：收銀亭加條紋遮陽篷
    const booth = shadowed(new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.2, 1.2), M.wall[1]));
    booth.position.y = 0.6;
    const counter = shadowed(new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.12, 0.4), M.wood));
    counter.position.set(0, 0.85, 0.7);
    c.add(booth, counter);

DEALS.forEach((d) => {
  const a = unitById[d.from], b = unitById[d.to];
  const pa = posOf(a), pb = posOf(b);
  const dir = pb.clone().sub(pa).setY(0).normalize();
  const side = new THREE.Vector3(-dir.z, 0, dir.x);
  const pair = DEALS.some((o) => o.from === d.to && o.to === d.from);
  const off = pair ? 1.25 : 0;
  const start = pa.clone().addScaledVector(dir, a.size * 0.95).addScaledVector(side, off).setY(0.78);
  const end = pb.clone().addScaledVector(dir, -b.size * 0.95).addScaledVector(side, off).setY(0.78);
  const mid = start.clone().lerp(end, 0.5).addScaledVector(side, off * 0.8);
  mid.y = 1.7;
  const curve = new THREE.QuadraticBezierCurve3(start, mid, end);
  const len = curve.getLength();
  const color = new THREE.Color(a.ext ? b.color : a.color);

  const group = new THREE.Group();
  const deckMat = mat("#b98a5e", { transparent: true, roughness: 0.9 });
  const railMat = mat("#7a5a3e", { transparent: true, emissive: color, emissiveIntensity: 0 });
  const planks = Math.max(10, Math.round(len / 0.5));
  for (let k = 0; k <= planks; k++) {
    if (d.unknown && k % 3 !== 0) continue;
    const t = k / planks;
    const p = curve.getPointAt(t);
    const plank = shadowed(new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.12, 0.4), deckMat));
    plank.position.copy(p);
    plank.lookAt(p.clone().add(curve.getTangentAt(t)));
    group.add(plank);
  }
  if (!d.unknown) {
    for (const s of [-0.88, 0.88]) {
      const pts = curve.getSpacedPoints(40).map((p, k, arr) => {
        const tan = curve.getTangentAt(k / (arr.length - 1));
        return p.clone().addScaledVector(new THREE.Vector3(-tan.z, 0, tan.x).normalize(), s).setY(p.y + 0.42);
      });
      group.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 40, 0.05, 5), railMat));
      for (let k = 0; k <= 8; k++) {
        const p = pts[Math.round((k / 8) * (pts.length - 1))];
        const post = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.45, 5), railMat));
        post.position.copy(p).setY(p.y - 0.21);
        group.add(post);
      }
    }
  }
  scene.add(group);

  const el = document.createElement("div");
  el.className = "brl off";
  el.style.borderLeftColor = color.getStyle();
  el.textContent = d.unknown ? `${d.what}・方向待確認` : d.what;
  const label = new CSS2DObject(el);
  label.position.copy(curve.getPointAt(0.5)).add(new THREE.Vector3(0, 1.6, 0));
  scene.add(label);
  bridges.push({ deal: d, curve, len, group, deckMat, railMat, el, color, glow: 0, glowTo: 0, delay: 0 });
});

function tickHandoff(dt) {
  if (!ho.on) return;
  if (ho.t >= Q0 && !ho.checked) {
    if (!ho.checking) {
      ho.checking = true;
      startCheck(() => { ho.checked = true; ho.checking = false; ho.backFrom = robot.position.clone(); robot.visible = true; }, false, true, true);
      check.from.copy(robot.position);
    }
    scroll.position.copy(robot.position).add(new THREE.Vector3(0, 1.0, 0));
    return; // 檢查期間由 tickCheck 控制機器人與鏡頭
  }
  ho.t += dt;
  const t = ho.t;
  if (t >= 1.4 && !ho.whooshed) { ho.whooshed = true; sound.whoosh(); } // Richard 丟出 Plan
  for (let i = HO.length - 1; i >= 0; i--) if (t >= HO[i].at) { if (ho.stage < i) { for (let j = ho.stage + 1; j <= i; j++) HO[j].run(); ho.stage = i; } break; }
  const pad = posOf(ALLWILL).add(new THREE.Vector3(1.0, 1.2, 0.6));
  const R = team.richard, B = team.ben, C = team.ccza;
  const hover = handPos(R).add(new THREE.Vector3(2.2, 1.6, 0));
  let look;
  // 機器人：飛到 Richard 旁邊 → 停在半空讀 Plan → 問答期間待在原地 → 最後飛向 RD
  if (t < 1.4) robot.position.copy(flyArc(pad, hover, ease(t / 1.4), 6));
  else if (t < Q0) robot.position.copy(hover).add(new THREE.Vector3(0, Math.sin(t * 2) * 0.15, 0));
  else if (t < Q0 + 1.6) robot.position.copy(flyArc(ho.backFrom || hover, hover, ease((t - Q0) / 1.6), 3));
  else if (t < QS) robot.position.copy(hover).add(new THREE.Vector3(0, Math.sin(t * 2) * 0.15, 0));
  else if (t < QS + 4 * QLEN) {
    const i = Math.min(3, Math.floor((t - QS) / QLEN)), m = team[PLAN_QS[i].who];
    const prev = i === 0 ? hover : handPos(team[PLAN_QS[i - 1].who]).add(new THREE.Vector3(2, 1.4, 0));
    robot.position.copy(flyArc(prev, handPos(m).add(new THREE.Vector3(2, 1.4, 0)), ease((t - QS - i * QLEN) / 1.0), 2.5));
    robot.position.y += Math.sin(t * 2) * 0.12;
  }
  const rd = B.g.position.clone().lerp(C.g.position, 0.5);
  const scrollAtBot = robot.position.clone().add(new THREE.Vector3(0, 1.0, 0));
  // 卷軸：Richard 舉著 → 丟給 AllWill → AllWill 展開讀 → 最後交到 RD 中間
  if (t < 1.4) { scroll.position.copy(handPos(R)); look = R.g.position; }
  else if (t < 2.4) { R.raised = false; scroll.position.copy(flyArc(handPos(R), scrollAtBot, ease((t - 1.4) / 1.0), 1.5)); look = robot.position; }
  else if (t < QS + 4 * QLEN) { scroll.position.copy(scrollAtBot); scroll.userData.ribbon.material.emissiveIntensity = t < Q0 ? 0.6 + Math.sin(t * 10) * 0.4 : 0.2; }
  else {
    const k = ease((t - QS - 4 * QLEN) / 2.2);
    robot.position.copy(flyArc(handPos(team.ccza).add(new THREE.Vector3(2, 1.4, 0)), rd.clone().add(new THREE.Vector3(1.5, 3.5, 0)), k, 2));
    scroll.position.copy(flyArc(scrollAtBot, rd.clone().add(new THREE.Vector3(0, 2.9, 0)), k, 2));
    B.raised = C.raised = k >= 1;
    look = rd;
  }
  scroll.rotation.y += dt * 1.5;
  // 問題小卡
  qcards.forEach((c, i) => {
    const t0 = QS + i * QLEN, m = team[c.q.who];
    if (t < t0) { c.el.classList.add("off"); return; }
    c.el.classList.remove("off");
    const k = ease((t - t0) / 1.2);
    c.o.position.copy(flyArc(scrollAtBot, headPos(m), ease((t - t0 - 0.8) / 0.8), 1.2));
    if (t >= t0 + 1.9) { c.el.classList.add("done"); c.el.querySelector("b").textContent = "✓"; }
    if (t >= t0 && t < t0 + QLEN) look = m.g.position.clone().lerp(robot.position.clone().setY(0), 0.4);
  });
  for (const m of Object.values(team)) if (m.raised) m.arms[1].rotation.x = -2.6;
  if (t >= 2.4 && t < QS) { if (portrait()) placeCamera(new THREE.Vector3(0, 0, -6), fitDistance(20, 19), 38); else placeCamera(new THREE.Vector3(0, 0, -5), fitDistance(30, 18), 34); }
  else if (look) placeCamera(look.clone().setY(0).add(new THREE.Vector3(0, 0, portrait() ? 4 : 2)), fitDistance(12, 10), portrait() ? 42 : 34);
}

  let o = hit.object;
  while (o && !targets.includes(o)) o = o.parent;
  const br = bridges.find((b) => b.group === o);
  if (br) return showDeal(br);
  const isl = Object.values(islands).find((i) => i.group === o);
  if (isl) showIsland(isl.unit);
});
function followGoal(dt, rate) {
  const k = 1 - Math.exp(-dt * rate);
  camera.position.lerp(camGoal.pos, k);
  controls.target.lerp(camGoal.target, k);
}
let manualFocus = 0;

// ── 迴圈 ──
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  if (touring && !["check", "handoff"].includes(STEPS[stepIndex].kind)) applyStep();
}
addEventListener("resize", resize);
resize();
// 開場：錄影模式直接從近景拉遠開始播；一般模式停在全貌，等使用者按播放
if (!params.has("rec")) {
  overviewView();
  camera.position.copy(camGoal.pos);
  controls.target.copy(camGoal.target);
  exploreHint();
  document.body.classList.add("cap-hidden");
  syncButtons();
} else {
  const m = bridgeById["course-finance"].curve.getPointAt(0.45);
  controls.target.copy(m);
  camera.position.copy(m).add(new THREE.Vector3(2.5, 3.2, 6.5));
}

const clock = new THREE.Clock();
let elapsed = 0;
function tick(dt) {
  elapsed += dt;
  waveSea(elapsed);

  if (touring) {
    stepTime += dt;
    const s = STEPS[stepIndex];
    if (s.sec && stepTime > s.sec) nextStep();
    if (s.kind === "handoff" && ho.t > HO_END) nextStep();
    followGoal(dt, firstPass && stepIndex === 0 ? 0.9 : 1.5);
  } else if (manualFocus > 0) {
    manualFocus -= dt;
    followGoal(dt, 2);
  }
  tickCheck(dt);
  tickRoam(dt);
  if (touring) tickHandoff(dt);
  if (robot.visible) {
    robot.userData.ring.scale.setScalar(1 + Math.sin(elapsed * 5) * 0.12);
    robot.children[0].position.y = 0.9 + Math.sin(elapsed * 4) * 0.06;
  }

  for (const b of bridges) {
    if (b.delay > 0) { b.delay -= dt; continue; }
    b.glow += (b.glowTo - b.glow) * (1 - Math.exp(-dt * 6));
    b.railMat.emissiveIntensity = b.glow * 0.9;
  }
  for (const w of walkers) {
    w.t += (w.dir * w.speed * dt) / w.br.len;
    if (w.t >= 1) { w.t = 1; w.dir = -1; }
    if (w.t <= 0) { w.t = 0; w.dir = 1; }
    w.box.visible = w.dir === 1; // 去程搬箱子，回程空手
    const t = THREE.MathUtils.clamp(w.t, 0.001, 0.999);
    const p = w.br.curve.getPointAt(t);
    const tan = w.br.curve.getTangentAt(t).multiplyScalar(w.dir);
    const sd = new THREE.Vector3(-tan.z, 0, tan.x).normalize();
    const step = elapsed * 9 + w.phase;
    w.g.position.copy(p).addScaledVector(sd, 0.42).setY(p.y + 0.06 + Math.abs(Math.sin(step)) * 0.08);
    w.g.rotation.y = Math.atan2(tan.x, tan.z);
    w.legs[0].rotation.x = Math.sin(step) * 0.6;
    w.legs[1].rotation.x = -Math.sin(step) * 0.6;
    w.legs[2].rotation.x = -Math.sin(step) * 0.6;
    w.legs[3].rotation.x = Math.sin(step) * 0.6;
  }
  for (const w of idlers) {
    w.a += (w.speed * dt) / (w.rad * 0.25);
    const step = elapsed * 7 + w.phase;
    w.g.position.set(w.center.x + Math.cos(w.a) * w.rad, 0.75 + Math.abs(Math.sin(step)) * 0.06, w.center.z + Math.sin(w.a) * w.rad);
    const s = Math.sign(w.speed);
    w.g.rotation.y = Math.atan2(-Math.sin(w.a) * s, Math.cos(w.a) * s);
    w.legs[0].rotation.x = Math.sin(step) * 0.5;
    w.legs[1].rotation.x = -Math.sin(step) * 0.5;
    w.legs[2].rotation.x = -Math.sin(step) * 0.5;
    w.legs[3].rotation.x = Math.sin(step) * 0.5;
  }
  if (mascots.water) {
    mascots.water.scale.set(1 + Math.sin(elapsed * 4.4) * 0.03, 1 - Math.sin(elapsed * 4.4) * 0.03, 1);
    mascots.wave.rotation.z = 2.5 + Math.sin(elapsed * 6) * 0.35;
  }
  for (const f of foams) { const k = 1 + Math.sin(elapsed * 1.2) * 0.025; f.scale.set(k, k, 1); f.material.opacity = 0.55 + Math.sin(elapsed * 1.2) * 0.15; }
  for (const f of flags) f.userData.cloth.rotation.y = Math.sin(elapsed * 2.4 + f.position.x) * 0.25;
  for (const c of clouds) { c.g.position.x += c.v * dt; if (c.g.position.x > 90) c.g.position.x = -90; }

  if (mascots.tags) { const near = camera.position.distanceTo(islands.course.group.position) < 70; mascots.tags.forEach((t) => (t.visible = near)); }
  controls.update();
  const camDist = camera.position.distanceTo(controls.target);
  scene.fog.near = camDist * 1.2;
  scene.fog.far = camDist * 3.4 + 60;
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
if (params.has("rec")) { window.__frame = (dt) => tick(dt); window.__avatars = avatars; }
else renderer.setAnimationLoop(() => tick(Math.min(clock.getDelta(), 0.05)));
</script>
</body>
</html>
