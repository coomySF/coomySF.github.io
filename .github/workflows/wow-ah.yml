name: wow-ah
# 魔獸永恆台灣拍賣場：每 20 分鐘看一次暴雪有沒有新快照，有就推算成交、更新 ah-data 分支
on:
  schedule:
    - cron: "12,32,52 * * * *"
  workflow_dispatch:
concurrency:
  group: wow-ah
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            _tools/wow-ah
            wow-ah/weekly
      - name: Check out ah-data
        run: |
          git config --global user.name "wow-ah bot"
          git config --global user.email "actions@users.noreply.github.com"
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          if git clone -q --depth 1 --branch ah-data "$url" data; then :; else
            mkdir data && cd data && git init -q -b ah-data && git remote add origin "$url"
          fi
      - name: Collect
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python3 _tools/wow-ah/collect.py --data data
      - name: Push
        working-directory: data
        run: |
          git add -A
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          n=$(cat .commits 2>/dev/null || echo 0); n=$((n + 1))
          if [ "$n" -ge 168 ]; then
            # 每週把歷史壓成一個 commit，分支不會越長越大
            git checkout -q --orphan squash && echo 1 > .commits && git add -A
            git commit -q -m "ah-data $(date -u +%FT%TZ)" && git branch -M ah-data
            git push -q --force origin ah-data
          else
            echo "$n" > .commits && git add .commits
            git commit -q -m "ah-data $(date -u +%FT%TZ)"
            git push -q origin HEAD:ah-data
          fi
      - name: Weekly report
        # 每天第一次執行時更新「本週」週報（靜態頁，Google 收錄得到）；同一天不重複 commit
        run: |
          python3 _tools/wow-ah/weekly.py --data data --out wow-ah/weekly
          if [ -n "$(git status --porcelain wow-ah/weekly)" ]; then
            git add wow-ah/weekly
            git commit -q -m "台服拍賣場週報 $(TZ=Asia/Taipei date +%F)"
            git pull -q --rebase origin main && git push -q origin HEAD:main
          fi
