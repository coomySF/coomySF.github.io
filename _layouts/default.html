<!doctype html>
<html lang="{{ site.lang | default: 'zh-TW' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#f3efe6">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Coomy 首頁">
        <span class="brand-mark">C</span>
        <span>Coomy</span>
      </a>
      <nav aria-label="主要選單">
        <a href="{{ '/writing/' | relative_url }}">文章</a>
        <a href="{{ '/about/' | relative_url }}">關於</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </nav>
    </header>
    <main>{{ content }}</main>
    <footer class="site-footer">
      <p>把做過的事留下來，讓下一次不用再從頭摸索。</p>
      <p>© {{ 'now' | date: '%Y' }} Coomy · Built on GitHub Pages</p>
    </footer>
  </body>
</html>
