<!doctype html>
<html lang="{{ site.lang | default: 'zh-TW' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#f2eee5">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+TC:wght@400;500;600;700&family=Shippori+Mincho:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v=20260805-2">
    <script>
      document.documentElement.classList.add('js');
      document.documentElement.dataset.theme = localStorage.getItem('coomy-theme-v2') || 'light';
    </script>
  </head>
  <body>
    <div class="reading-progress" aria-hidden="true"><span></span></div>
    <div class="paper-noise" aria-hidden="true"></div>
    <div class="cursor-aura" aria-hidden="true"></div>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Coomy 首頁">
        <span class="brand-mark">C</span>
        <span>Coomy</span>
      </a>
      <nav aria-label="主要選單">
        <a href="{{ '/writing/' | relative_url }}">文章</a>
        <a href="{{ '/about/' | relative_url }}">關於</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
        <button class="theme-toggle" type="button" aria-label="切換明暗模式" aria-pressed="false">
          <span>明暗</span><i aria-hidden="true"></i>
        </button>
      </nav>
    </header>
    <main>{{ content }}</main>
    <footer class="site-footer">
      <p>把做過的事留下來，讓下一次不用再從頭摸索。</p>
      <p>© {{ 'now' | date: '%Y' }} Coomy · Built on GitHub Pages</p>
    </footer>
    <script src="{{ '/assets/js/site.js' | relative_url }}?v=20260805-2" defer></script>
  </body>
</html>
