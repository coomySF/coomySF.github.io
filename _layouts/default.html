<!doctype html>
<html lang="{{ site.lang | default: 'zh-TW' }}">
  <head>
    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);

    <!-- End Google Tag Manager -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    {% if page.keywords %}
    <meta name="keywords" content="{{ page.keywords | join: ', ' | escape }}">
    {% endif %}
    <meta name="theme-color" content="#f2eee5">
    <link rel="icon" type="image/png" sizes="256x256" href="{{ '/assets/favicon.png' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ '/assets/favicon.png' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+TC:wght@400;500;600;700&family=Shippori+Mincho:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v=20260805-11">
    <script>
      document.documentElement.classList.add('js');
    </script>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-T277CMLJ"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div class="reading-progress" aria-hidden="true"><span></span></div>
    <div class="paper-noise" aria-hidden="true"></div>
    <div class="cursor-aura" aria-hidden="true"></div>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Coomy 首頁">
        <span class="brand-mark">C</span>
        <span>Coomy</span>
      </a>
      <nav aria-label="主要選單">
        <a href="{{ '/writing/' | relative_url }}">文章</a>
        <a href="{{ '/life/' | relative_url }}">我們的日子</a>
        <a href="{{ '/battle-top/' | relative_url }}">戰鬥陀螺</a>
        <a href="{{ '/lab/' | relative_url }}">實驗室</a>
        <a href="{{ '/' | relative_url }}#about">關於</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </nav>
    </header>
    <main>{{ content }}</main>
    <footer class="site-footer">
      <p>把做過的事留下來，讓下一次不用再從頭摸索。</p>
      <p>© {{ 'now' | date: '%Y' }} Coomy · Built on GitHub Pages</p>
    </footer>
    <script src="{{ '/assets/js/site.js' | relative_url }}?v=20260805-4" defer></script>
  </body>
</html>
